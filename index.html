<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révision Devoir de contrôle Info</title>
<script>try{var th=localStorage.getItem("devoir-info-4sc-v1-theme")||"dark";if(th!=="auto")document.documentElement.setAttribute("data-theme",th);document.documentElement.setAttribute("data-mode",th==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):th);}catch(e){document.documentElement.setAttribute("data-theme","dark");document.documentElement.setAttribute("data-mode","dark");}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
/* Same system as the two PDF résumés: dark = "écran" (ranks Fer → Challenger, hexagon badges),
   light = "coloré" (white, coloured outlines, round badges). Fredoka for display, Nunito for text, JetBrains Mono for code. */
:root{
  --bg:#ffffff; --surface:#ffffff; --tint:#f7f8fa; --ink:#1d2330; --muted:#6b7280; --line:#dfe3ea; --line2:#eef0f4;
  --codebg:#ffffff; --on-c:#ffffff;
  --good:#2b8a3e; --bad:#d6336c; --warn:#c27c0e; --blue:#1971c2; --cx:#5f3dc4;
  --c1:#d6336c; --c2:#e8590c; --c3:#b8860b; --c4:#2b8a3e; --c5:#0c8599; --c6:#1971c2; --c7:#5f3dc4; --c8:#ae3ec9; --c9:#c2255c; --c10:#364fc7;
  --kw:#1c5fd0; --fn:#0f7b6c; --str:#b45309; --cst:#a21caf; --op:#c2410c; --num:#be123c; --com:#8b95a5;
  --font-display:"Fredoka","Nunito",system-ui,sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-code:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --c:var(--c1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1016; --surface:#151a24; --tint:#1a2030; --ink:#e6e9ef; --muted:#8b93a7; --line:#2a3142; --line2:#1f2533;
    --codebg:#10141c; --on-c:#0d1016;
    --good:#45d483; --bad:#ff6b81; --warn:#f2b84b; --blue:#6fa8ff; --cx:#ffd76a;
    --c1:#a3abb7; --c2:#d4864a; --c3:#c3cede; --c4:#f0bf3c; --c5:#3cc9b8; --c6:#34c27a; --c7:#6f8dff; --c8:#b56cff; --c9:#ff5c6c; --c10:#4fd2ff;
    --kw:#7aa2ff; --fn:#5fd4c4; --str:#f2b56b; --cst:#d68cff; --op:#ff8f6b; --num:#ff7b9a; --com:#6b7488;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1016; --surface:#151a24; --tint:#1a2030; --ink:#e6e9ef; --muted:#8b93a7; --line:#2a3142; --line2:#1f2533;
  --codebg:#10141c; --on-c:#0d1016;
  --good:#45d483; --bad:#ff6b81; --warn:#f2b84b; --blue:#6fa8ff; --cx:#ffd76a;
  --c1:#a3abb7; --c2:#d4864a; --c3:#c3cede; --c4:#f0bf3c; --c5:#3cc9b8; --c6:#34c27a; --c7:#6f8dff; --c8:#b56cff; --c9:#ff5c6c; --c10:#4fd2ff;
  --kw:#7aa2ff; --fn:#5fd4c4; --str:#f2b56b; --cst:#d68cff; --op:#ff8f6b; --num:#ff7b9a; --com:#6b7488;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--c);outline-offset:2px;border-radius:6px}
code{font-family:var(--font-code);font-size:.88em;font-variant-ligatures:none;color:var(--kw)}
small{color:var(--muted);font-size:.8em}
h1,h2,h3{font-family:var(--font-display);font-weight:600;text-wrap:balance;line-height:1.15}
b,strong{font-weight:800}

/* ---------- badges: round in light, hexagon in dark (like the PDFs) */
.hx{display:inline-grid;place-items:center;flex:none;font-family:var(--font-display);font-weight:600;color:var(--c);border:2px solid var(--c);border-radius:50%;width:30px;height:30px;font-size:14px}
:root[data-mode="dark"] .hx{border:none;background:var(--c);color:#0d1016;border-radius:0;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);width:34px}
.hx.lg{width:58px;height:52px;font-size:26px;border-width:3px;border-radius:16px}
:root[data-mode="dark"] .hx.lg{width:62px;height:54px;border-radius:0}

/* ---------- shell */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:18px 12px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px;text-decoration:none;color:inherit}
.brand .mark{width:40px;height:36px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;color:var(--on-c);background:var(--c10);font-size:14px;border-radius:10px}
:root[data-mode="dark"] .brand .mark{border-radius:0;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
.brand b{font-family:var(--font-display);font-weight:600;font-size:16.5px;display:block;line-height:1.1}
.brand span span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .lab{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--muted);padding:8px 8px 4px;text-transform:uppercase}
.nav a{display:grid;grid-template-columns:34px 1fr;column-gap:10px;align-items:center;padding:5px 8px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:700;font-size:14.5px;line-height:1.2}
.nav a:hover{background:color-mix(in srgb,var(--c) 10%,transparent)}
.nav a.on{background:color-mix(in srgb,var(--c) 16%,transparent)}
.nav .t small{display:block;font-family:var(--font-display);font-weight:600;font-size:10.5px;letter-spacing:.1em;color:var(--c);text-transform:uppercase}
:root[data-mode="light"] .nav .t small{display:none}
.nav .bar{grid-column:2;height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:3px}
.nav .bar i{display:block;height:100%;background:var(--c)}
.rail .foot{margin-top:auto;font-size:12.5px;color:var(--muted);padding:0 8px;display:flex;flex-direction:column;gap:8px}
.linkbtn{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:12.5px;text-align:left}
main{padding:26px clamp(16px,4vw,44px) 80px;max-width:1120px;width:100%}

/* ---------- common */
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.muted{color:var(--muted)}
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:11px;font-weight:800;font-size:14.5px;background:var(--c);color:var(--on-c);border:2px solid var(--c);transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--c)}
.btn.small{padding:5px 12px;font-size:13.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.good{color:var(--good)}.bad{color:var(--bad)}
.tag{font-size:12px;font-weight:700;color:var(--c);border:1.2px solid var(--c);border-radius:99px;padding:1px 10px}
:root[data-mode="dark"] .tag{font-family:var(--font-code);font-weight:500;background:color-mix(in srgb,var(--c) 14%,transparent);border-color:transparent;border-radius:6px}

/* ---------- level head (fiche head of the PDF) */
.fhead{display:flex;align-items:center;gap:16px;padding:14px 18px;border:1.5px solid var(--c);border-radius:16px;margin-bottom:10px}
:root[data-mode="dark"] .fhead{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.fhead .ftxt{flex:1;min-width:0}
.fhead h1{font-size:clamp(24px,3.4vw,34px)}
.fhead .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:320px}
.goal{color:var(--muted);max-width:70ch;margin:4px 0 16px}

/* ---------- home cover (PDF cover) */
.cover{border:1.5px solid var(--c1);border-radius:20px;padding:24px 26px 20px;position:relative;margin-bottom:22px}
:root[data-mode="dark"] .cover{background:radial-gradient(120% 140% at 0% 0%,#1d2540 0%,var(--surface) 55%);border-color:#2f3a58}
.cover .kick{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--c1)}
:root[data-mode="dark"] .cover .kick{color:var(--c10)}
.cover h1{font-size:clamp(34px,5.4vw,56px);font-weight:700;margin:6px 0 8px;letter-spacing:-.01em}
.cover h1 em{font-style:normal;color:var(--c1)}
:root[data-mode="dark"] .cover h1 em{color:var(--c10)}
.cover p{max-width:60ch;color:var(--muted);font-size:16.5px}
.cover .stats{position:absolute;right:24px;top:22px;text-align:right;color:var(--muted);font-size:13px;line-height:1.5}
.cover .stats b{color:var(--ink);font-family:var(--font-display);font-weight:600;font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin-top:20px}
.tile{text-align:center;font-size:11.5px;color:var(--muted);line-height:1.2;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:12px}
.tile:hover{background:color-mix(in srgb,var(--c) 10%,transparent)}
.tile .hx{width:40px;height:40px;font-size:17px}
:root[data-mode="dark"] .tile .hx{width:46px}
.tile .rkn{font-family:var(--font-display);font-weight:600;font-size:10.5px;letter-spacing:.08em;color:var(--c);text-transform:uppercase}
:root[data-mode="light"] .tile .rkn{display:none}
.tile .tp{display:block;height:3px;width:70%;background:var(--line);border-radius:3px;overflow:hidden}
.tile .tp i{display:block;height:100%;background:var(--c)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.homegrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.meter{display:flex;gap:14px;align-items:center}
.meter .big{font-family:var(--font-display);font-size:38px;font-weight:600;font-variant-numeric:tabular-nums}
.meter .track{flex:1;height:10px;border-radius:10px;background:var(--line);overflow:hidden;max-width:320px}
.meter .track i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5),var(--c6),var(--c7),var(--c8),var(--c9),var(--c10));border-radius:10px}
.flashq{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px}
.flashq .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.chcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);border-left:4px solid var(--c);transition:transform .15s}
.chcard:hover{transform:translateY(-2px)}
.chcard .top{display:flex;gap:10px;align-items:center}
.chcard h3{font-size:16.5px}
.chcard p{font-size:13.5px;color:var(--muted);flex:1}
.chcard .stats{display:flex;gap:10px;font-size:12px;color:var(--muted);font-weight:700}
.prog{height:5px;border-radius:5px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--c)}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 12px;gap:12px;flex-wrap:wrap}
.sech h2{font-size:22px}

/* ---------- chapter */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:8px;flex-wrap:wrap}
.tabs button{padding:9px 14px;font-weight:800;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;font-size:14.5px}
.tabs button.on{color:var(--c);border-color:var(--c)}
.tabs .sp{flex:1}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;align-self:center;margin-bottom:6px}
.seg button{padding:5px 11px;font-size:13px;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--c);color:var(--on-c)}
.block{margin-bottom:20px}
.sec{display:flex;align-items:baseline;gap:9px;margin-bottom:8px}
.sec::before{content:"";width:11px;height:11px;border:2.5px solid var(--c);border-radius:50%;align-self:center;flex:none}
.sec h3{font-size:18px}
.sec span{color:var(--muted);font-size:13.5px}

/* code faces: same panel style as the PDFs */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair.only-algo,.pair.only-py{grid-template-columns:1fr}
.pair.only-algo .face.py,.pair.only-py .face.algo{display:none}
.face{border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0;display:flex;flex-direction:column;background:var(--codebg)}
.face .lab{font-size:10.5px;font-weight:800;letter-spacing:.14em;padding:7px 14px 6px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line2);color:var(--c)}
.face.py .lab{color:var(--blue)}
.face pre{margin:0;padding:6px 0 12px;overflow-x:auto;font-family:var(--font-code);font-size:13.3px;line-height:1.6;font-variant-ligatures:none;flex:1}
.face .ln{display:inline-block;width:2.6em;text-align:right;padding-right:1em;color:var(--com);opacity:.7;user-select:none;font-size:.82em}
.face .cons{border-top:1px dashed var(--line);padding:8px 14px 10px;font-family:var(--font-code);font-size:12.5px;color:var(--muted);white-space:pre;overflow-x:auto}
.face .cons::before{content:"CONSOLE";display:block;font-family:var(--font-body);font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--good);margin-bottom:2px}
.kw{color:var(--kw);font-weight:700}.fn{color:var(--fn)}.str{color:var(--str)}.cst{color:var(--cst);font-weight:700}.op{color:var(--op);font-weight:700}.num{color:var(--num)}.com{color:var(--com);font-style:italic}.arr{color:var(--op);font-weight:700}
.mod{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px 16px;margin-bottom:16px}
.mod .mh{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.mod .tagn{font-family:var(--font-display);font-weight:600;color:var(--c);border:2px solid var(--c);border-radius:7px;padding:0 8px;font-size:14.5px}
:root[data-mode="dark"] .mod .tagn{background:var(--c);color:#0d1016}
.mod h3{font-size:17px;flex:1;min-width:200px}
.mod .kind{font-family:var(--font-code);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:2px 8px}
.mod .note{font-size:14px;color:var(--muted);margin:-4px 0 10px}
.tdol{border-collapse:collapse;font-size:13px;margin-top:10px}
.tdol caption{text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.13em;color:var(--c);padding-bottom:3px}
.tdol th,.tdol td{border:1px solid var(--line);padding:3px 12px;text-align:left}
.tdol th{color:var(--muted);font-size:11.5px}
.tdol td:first-child{font-family:var(--font-code)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--surface)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);padding:10px 14px;border-bottom:2px solid var(--c);font-weight:800}
.tbl td{padding:8px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl.dict td,.tbl.mono td{font-family:var(--font-code);font-size:13.3px;font-variant-ligatures:none}
.tbl.dict td:nth-child(2),.tbl.dict td:nth-child(4),.tbl.mono td:nth-child(2){color:var(--blue)}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:11px;padding:11px 15px;font-size:15px}
:root[data-mode="dark"] .box{background:color-mix(in srgb,var(--c) 6%,var(--surface))}
.box .bt{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--c);margin-bottom:4px;display:flex;gap:7px;align-items:center}
.box .bt::before{content:"";width:8px;height:8px;border:2px solid currentColor;border-radius:50%}
.box.piege{border-left-color:var(--bad)}.box.piege .bt{color:var(--bad)}
:root[data-mode="dark"] .box.piege{background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.box.astuce{border-left-color:var(--good)}.box.astuce .bt{color:var(--good)}
.box.cours{border-left-color:var(--cst)}.box.cours .bt{color:var(--cst)}
.box ul,.box ol{padding-left:18px}.box li{margin:3px 0}

/* ---------- quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.score{font-family:var(--font-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin-bottom:12px}
.q .qt{font-weight:700;font-size:16px;margin-bottom:11px;display:flex;gap:10px}
.q .qn{font-family:var(--font-display);color:var(--c);flex:none}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.opt{text-align:left;padding:9px 13px;border:1.5px solid var(--line);border-radius:10px;font-family:var(--font-code);font-size:13.8px;font-variant-ligatures:none;background:var(--tint);transition:border-color .12s}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 13%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--surface))}
.opt:disabled{cursor:default}
.why{margin-top:10px;font-size:14.5px;padding:9px 12px;border-radius:10px;background:var(--tint)}
.why b.v{color:var(--good)}.why b.x{color:var(--bad)}

/* ---------- exercises */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin-bottom:14px}
.ex .et{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ex h4{font-size:15.5px;font-weight:800}
.done-pill{font-size:12px;font-weight:800;color:var(--good);border:1.5px solid var(--good);border-radius:99px;padding:1px 9px}
.redo-pill{font-size:12px;font-weight:800;color:var(--warn);border:1.5px solid var(--warn);border-radius:99px;padding:1px 9px}
.blank{font-family:var(--font-code);font-size:13px;font-variant-ligatures:none;background:color-mix(in srgb,var(--c) 12%,transparent);border:none;border-bottom:2px solid var(--c);border-radius:4px 4px 0 0;padding:1px 4px;min-width:3ch;color:inherit;outline:none}
.face.py .blank{border-bottom-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent)}
.blank.ok{border-bottom-color:var(--good)!important;background:color-mix(in srgb,var(--good) 18%,transparent)!important}
.blank.no{border-bottom-color:var(--bad)!important;background:color-mix(in srgb,var(--bad) 18%,transparent)!important}
.exbar{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.symkeys{display:flex;gap:4px}
.symkeys button{font-family:var(--font-code);border:1.5px solid var(--line);border-radius:8px;padding:2px 10px;font-size:15px;background:var(--tint)}
.msg{font-size:14.5px;font-weight:700}
.tin{font-family:var(--font-code);padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--tint);min-width:200px;font-size:14px}
.parsons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pz{border:1.5px dashed var(--line);border-radius:12px;padding:8px;min-height:80px;display:flex;flex-direction:column;gap:5px}
.pz .plab{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--muted);padding:2px 4px}
.pline{font-family:var(--font-code);font-size:13px;text-align:left;white-space:pre;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--codebg);overflow-x:auto;font-variant-ligatures:none}
.pline:hover{border-color:var(--c)}
.subh{font-family:var(--font-display);font-weight:600;font-size:19px;margin:24px 0 12px;display:flex;align-items:center;gap:10px}
.subh .cnt{font-family:var(--font-body);font-size:13px;color:var(--muted);font-weight:700}

/* ---------- series & sujets */
.prob{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 18px;margin-bottom:16px}
.prob .ph{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.prob h3{font-size:17.5px;flex:1;min-width:220px}
.prob .enonce{font-size:15.5px;max-width:84ch}
.prob .enonce b{color:var(--c)}
.ans{margin-top:12px}
.ans label{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--muted);display:block;margin-bottom:4px}
.ans textarea{width:100%;min-height:150px;resize:vertical;font-family:var(--font-code);font-size:13.3px;line-height:1.55;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--codebg);font-variant-ligatures:none;tab-size:4}
.ans textarea:focus{border-color:var(--c);outline:none}
.lock{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.lock .msg{font-weight:600;color:var(--muted);font-size:14px}
.corr{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.corr .ctabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.corr .ctabs button{padding:5px 12px;border-radius:9px;font-weight:800;font-size:13.5px;color:var(--muted);border:1.5px solid var(--line)}
.corr .ctabs button.on{color:var(--on-c);background:var(--c);border-color:var(--c)}
.corr .cpane[hidden]{display:none}
.notes{display:flex;flex-direction:column;gap:8px}
.notes li{list-style:none;padding:9px 13px;border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--surface));border-radius:9px;font-size:14.5px}
.selfgrade{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:14px;font-weight:700}
.tdo{border-collapse:collapse;font-size:13px;margin-top:10px;min-width:280px}
.tdo th,.tdo td{border:1px solid var(--line);padding:4px 12px;text-align:left;vertical-align:top}
.tdo th{font-size:10.5px;letter-spacing:.12em;color:var(--c);text-transform:uppercase}
.tdo td:first-child{font-family:var(--font-code);font-size:12.5px}

/* ---------- flashcards */
.flash{max-width:560px;margin:10px auto;perspective:1200px}
.fc{position:relative;height:230px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
.fc.flip{transform:rotateY(180deg)}
.fc .side{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;border:1px solid var(--line);background:var(--codebg)}
.fc .back{transform:rotateY(180deg);border-color:var(--c)}
.fc .big{font-family:var(--font-code);font-size:24px;font-weight:500;font-variant-ligatures:none}
.fc .lab{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--c)}
.fc .back .lab{color:var(--blue)}
.fnav{display:flex;justify-content:center;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}

/* ---------- devoir */
.timer{font-family:var(--font-display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.dvstick{position:sticky;top:0;z-index:6;background:var(--bg);padding:10px 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);margin-bottom:16px;gap:12px;flex-wrap:wrap}
.result{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.result .note{font-family:var(--font-display);font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hist{display:flex;gap:8px;flex-wrap:wrap}
.hist span{font-size:13px;font-weight:800;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-variant-numeric:tabular-nums}
.tagch{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--c);text-transform:uppercase}
.theme{align-self:flex-start;margin:0 0 4px;--c:var(--ink)}
.theme button.on{background:var(--ink);color:var(--surface)}

@media (max-width: 960px){ .tiles{grid-template-columns:repeat(5,1fr)} .homegrid{grid-template-columns:1fr} }
@media (max-width: 860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 10px;gap:8px;border-right:none;border-bottom:1px solid var(--line);z-index:10}
  .brand span,.nav .lab,.nav .bar,.nav .t{display:none}
  .nav{flex-direction:row}
  .nav a{grid-template-columns:34px;padding:4px}
  .rail .foot{display:flex;margin-top:0;margin-left:auto;padding:0}
  .rail .foot>span,.rail .foot>.linkbtn{display:none}
  .pair,.parsons{grid-template-columns:1fr}
  .tabs,.dvstick{top:54px}
  .cover .stats{position:static;text-align:left;margin-top:8px}
  .fhead{flex-wrap:wrap}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

const DATA = [{"id": "dictionnaire", "n": 1, "title": "Le dictionnaire algo ⟷ Python", "short": "Dictionnaire", "goal": "Traduire chaque instruction et chaque fonction prédéfinie d'un langage à l'autre.", "lesson": [{"t": "table", "head": ["Algorithme (copie)", "Python (machine)", "Fonction en algorithme", "Python"], "cls": "dict", "rows": [["x ← 5", "x = 5", "long(ch)", "len(ch)"], ["=  ≠", "==  !=", "pos(a, ch)", "ch.find(a)  <small>-1 si absent<\/small>"], ["≤  ≥", "<=  >=", "sous_chaîne(ch, d, f)", "ch[d:f]  <small>f exclu<\/small>"], ["div  mod", "//  %", "effacer(ch, d, f)", "ch[:d] + ch[f:]"], ["et  ou  non", "and  or  not", "majus(ch)", "ch.upper()"], ["Vrai  Faux", "True  False", "convch(n)", "str(n)"], ["Ecrire(x)", "print(x)", "valeur(ch)", "int(ch)  <small>ou float(ch)<\/small>"], ["Ecrire(x, \" \")  <small>même ligne<\/small>", "print(x, end=\" \")", "estnum(ch)", "ch.isnumeric()"], ["Lire(ch)  <small>chaîne<\/small>", "ch = input()", "ord(c)  chr(n)", "ord(c)  chr(n)"], ["Lire(n)  <small>entier<\/small>", "n = int(input())", "abs(x)  ent(x)", "abs(x)  int(x)"], ["Lire(x)  <small>réel<\/small>", "x = float(input())", "arrondi(x)", "round(x)"], ["n ∈ [5..20]", "5 <= n <= 20", "racinecarré(x)", "sqrt(x)  <small>from math<\/small>"], ["c ∈ {\"A\", \"E\"}", "c in {\"A\", \"E\"}", "aléa(a, b)", "randint(a, b)  <small>from random<\/small>"]]}, {"t": "boxes", "items": [{"k": "coeur", "title": "div et mod", "html": "<code>17 div 5 = 3<\/code> · <code>17 mod 5 = 2<\/code> · <code>17 / 5 = 3.4<\/code><br><code>n mod 2 = 0<\/code> : n est pair · <code>n mod d = 0<\/code> : d divise n<br><code>n mod 10<\/code> : dernier chiffre · <code>n div 10<\/code> : n sans son dernier chiffre"}, {"k": "coeur", "title": "codes et priorités", "html": "<code>\"0\" = 48<\/code> · <code>\"A\" = 65<\/code> · <code>\"a\" = 97<\/code> (écart de 32 entre majuscule et minuscule).<br>Priorités : <code>( )<\/code>, puis <code>* / div mod<\/code>, puis <code>+ -<\/code>, puis les comparaisons. En logique : <b>non<\/b>, puis <b>et<\/b>, puis <b>ou<\/b>."}, {"k": "piege", "title": "input()", "html": "<code>input()<\/code> rend <b>toujours une chaîne<\/b>. Sans <code>int( )<\/code>, <code>\"5\" + \"3\"<\/code> donne <code>\"53\"<\/code>."}, {"k": "piege", "title": "les indices", "html": "Ils commencent à <b>0<\/b> : dernier caractère <code>ch[long(ch) - 1]<\/code>, dernière case <code>T[n - 1]<\/code>."}, {"k": "piege", "title": "round", "html": "<code>round(2.5)<\/code> donne <b>2<\/b> et <code>round(3.5)<\/code> donne <b>4<\/b> : Python arrondit un ,5 vers l'entier pair."}]}], "quiz": [{"q": "Que vaut <code>17 div 5<\/code> ?", "o": ["3", "3.4", "2", "4"], "why": "div donne le quotient entier : 17 = 5 × 3 + 2.", "a": 0}, {"q": "Que vaut <code>17 mod 5<\/code> ?", "o": ["2", "3", "5", "0"], "why": "mod donne le reste : 17 = 5 × 3 + <b>2<\/b>.", "a": 0}, {"q": "Comment écrit-on <code>ch[long(ch) - 1]<\/code> en Python ?", "o": ["ch[len(ch) - 1]", "ch[len(ch)]", "ch[long(ch) - 1]", "ch.last()"], "why": "long devient len. Le dernier indice est la longueur moins 1, car on commence à 0.", "a": 0}, {"q": "Que vaut <code>sous_chaîne(\"bonjour\", 0, 3)<\/code> ?", "o": ["\"bon\"", "\"bonj\"", "\"onj\"", "\"bo\""], "why": "On prend les indices 0, 1 et 2 : la position de fin est <b>exclue<\/b>. En Python : <code>ch[0:3]<\/code>.", "a": 0}, {"q": "Que vaut <code>pos(\"j\", \"bonjour\")<\/code> ?", "o": ["3", "4", "2", "-1"], "why": "b=0, o=1, n=2, <b>j=3<\/b>. En Python : <code>\"bonjour\".find(\"j\")<\/code>.", "a": 0}, {"q": "Que vaut <code>effacer(\"bonjour\", 1, 3)<\/code> ?", "o": ["\"bjour\"", "\"bour\"", "\"bnjour\"", "\"bonjour\""], "why": "On efface les indices 1 et 2 (\"on\"), la fin 3 est exclue. En Python : <code>ch[:1] + ch[3:]<\/code>.", "a": 0}, {"q": "En Python, <code>round(2.5)<\/code> donne…", "o": ["2", "3", "2.5", "une erreur"], "why": "Python arrondit un ,5 vers l'entier <b>pair<\/b> le plus proche : 2.", "a": 0}, {"q": "Que vaut <code>ord(\"A\")<\/code> ?", "o": ["65", "97", "48", "1"], "why": "Code ASCII : \"0\" = 48, \"A\" = 65, \"a\" = 97.", "a": 0}, {"q": "Que vaut <code>non Vrai ou Vrai et Faux<\/code> ?", "o": ["Faux", "Vrai"], "why": "D'abord non : Faux. Puis et : Vrai et Faux = Faux. Enfin ou : Faux ou Faux = <b>Faux<\/b>.", "a": 0}, {"q": "Comment traduire <code>n ∈ [5..20]<\/code> en Python ?", "o": ["5 <= n <= 20", "n in [5..20]", "5 < n < 20", "n in range(5, 20)"], "why": "[5..20] contient 5 et 20. <code>range(5, 20)<\/code> s'arrêterait à 19.", "a": 0}, {"q": "On écrit <code>n = input()<\/code> puis <code>n + 1<\/code>. Que se passe-t-il ?", "o": ["Une erreur TypeError", "On obtient n + 1", "On obtient \"n1\"", "Rien"], "why": "n est une chaîne : chaîne + entier est interdit. Il fallait <code>n = int(input())<\/code>.", "a": 0}, {"q": "Que donne <code>convch(2027)<\/code> ?", "o": ["la chaîne \"2027\"", "l'entier 2027", "la liste des chiffres", "une erreur"], "why": "convch convertit un nombre en chaîne. En Python : <code>str(2027)<\/code>.", "a": 0}], "fill": [{"title": "Traduis en Python : lire n, tester s'il est pair et plus grand que 10, afficher son nombre de chiffres", "lang": "py", "src": "n = [[int]](input(\"n = \"))\nif n [[%]] 2 [[==]] 0 [[and]] n > 10:\n    print(\"pair et > 10\")\nch = [[str]](n)\nprint([[len]](ch))"}, {"title": "Traduis en algorithme", "lang": "algo", "src": "x [[←]] 7\n[[Si]] x mod 2 [[≠]] 0 Alors\n    [[Ecrire]](\"impair\")\nFinSi\nch ← [[convch]](x)"}], "trace": [{"title": "Qu'affiche ce programme ?", "lang": "py", "src": "n = 472\nprint(n % 10, n // 10, n // 100)", "ans": "2 47 4", "why": "472 % 10 = 2 (dernier chiffre), 472 // 10 = 47, 472 // 100 = 4."}, {"title": "Qu'affiche ce programme ?", "lang": "py", "src": "ch = \"bonjour\"\nprint(ch[0:3], ch.find(\"j\"), len(ch))", "ans": "bon 3 7", "why": "ch[0:3] prend les indices 0 à 2. \"j\" est à l'indice 3. La chaîne a 7 caractères."}, {"title": "Qu'affiche ce programme ?", "lang": "py", "src": "a = \"5\"\nb = 3\nprint(a + str(b), int(a) + b)", "ans": "53 8", "why": "Chaîne + chaîne colle les deux : \"53\". Entier + entier additionne : 8."}], "parsons": [], "flash": true}, {"id": "boucles", "n": 2, "title": "Conditions et boucles", "short": "Conditions, boucles", "goal": "Choisir la bonne structure : Si, Pour, Répéter ou Tant que, et la traduire sans se tromper de bornes.", "lesson": [{"t": "pair", "title": "Si… Sinon Si… Sinon", "sub": "on s'arrête au premier cas vrai", "algo": "Si moy ≥ 16 Alors\n    mention ← \"Très bien\"\nSinon Si moy ≥ 12 Alors\n    mention ← \"Bien\"\nSinon\n    mention ← \"Passable\"\nFinSi", "py": "if moy >= 16:\n    mention = \"Très bien\"\nelif moy >= 12:\n    mention = \"Bien\"\nelse:\n    mention = \"Passable\""}, {"t": "pair", "title": "Pour", "sub": "nombre de tours connu d'avance", "algo": "s ← 0\nPour i de 1 à n Faire\n    s ← s + i\nFinPour", "py": "s = 0\nfor i in range(1, n + 1):\n    s = s + i"}, {"t": "pair", "title": "Répéter… Jusqu'à", "sub": "au moins un tour : c'est le contrôle de saisie", "algo": "Répéter\n    Ecrire(\"n entre 5 et 20 : \")\n    Lire(n)\nJusqu'à (5 ≤ n) et (n ≤ 20)", "py": "n = int(input(\"n entre 5 et 20 : \"))\nwhile not (5 <= n <= 20):\n    n = int(input(\"n entre 5 et 20 : \"))", "cons": "n entre 5 et 20 : 3\nn entre 5 et 20 : 25\nn entre 5 et 20 : 12"}, {"t": "pair", "title": "Tant que", "sub": "peut-être zéro tour ; ici la somme des chiffres de n", "algo": "s ← 0\nTantque n ≠ 0 Faire\n    s ← s + n mod 10\n    n ← n div 10\nFinTantque", "py": "s = 0\nwhile n != 0:\n    s = s + n % 10\n    n = n // 10", "cons": "# avec n = 472\n>>> s\n13"}, {"t": "table", "head": ["Pour… en algorithme", "range en Python"], "rows": [["de 0 à n - 1", "range(n)"], ["de 1 à n", "range(1, n + 1)"], ["de a à b", "range(a, b + 1)"], ["de n à 1 (Pas = -1)", "range(n, 0, -1)"]], "cls": "mono"}, {"t": "boxes", "items": [{"k": "coeur", "title": "Répéter ⟷ Tant que", "html": "Condition du Tant que = <b>non<\/b> (condition du Jusqu'à) : on inverse chaque test et on échange <b>et ⟷ ou<\/b>."}, {"k": "coeur", "title": "range", "html": "range s'arrête <b>avant<\/b> la fin : écris Fin + 1 (Fin - 1 si le pas est négatif)."}, {"k": "piege", "title": "les initialisations", "html": "Somme : <b>0<\/b>. Produit : <b>1<\/b>. Maximum : <b>la première valeur<\/b>. Selon se traduit par <code>if / elif / else<\/code>."}]}], "quiz": [{"q": "<code>Pour i de 1 à n<\/code> se traduit par…", "o": ["range(1, n + 1)", "range(n)", "range(1, n)", "range(0, n + 1)"], "why": "range s'arrête avant sa borne de fin : pour aller jusqu'à n, on écrit n + 1.", "a": 0}, {"q": "<code>Pour i de n à 1 (Pas = -1)<\/code> se traduit par…", "o": ["range(n, 0, -1)", "range(n, 1, -1)", "range(1, n, -1)", "range(n, -1, -1)"], "why": "Avec un pas négatif, la fin est exclue aussi : pour s'arrêter à 1, on écrit 0.", "a": 0}, {"q": "Quelle boucle fait <b>toujours<\/b> au moins un tour ?", "o": ["Répéter… Jusqu'à", "Tant que", "Pour", "Aucune"], "why": "Le test du Répéter est à la fin : le corps s'exécute avant le premier test.", "a": 0}, {"q": "<code>Répéter … Jusqu'à n > 0<\/code> : en Python, la boucle s'écrit…", "o": ["while not (n > 0):", "while n > 0:", "while n < 0:", "if n > 0:"], "why": "Jusqu'à donne la condition pour <b>sortir<\/b>, while celle pour <b>rester<\/b> : on prend la négation.", "a": 0}, {"q": "La négation de <code>(1 ≤ n) et (n ≤ 10)<\/code> est…", "o": ["(n < 1) ou (n > 10)", "(n < 1) et (n > 10)", "(n ≤ 1) ou (n ≥ 10)", "(n > 1) et (n < 10)"], "why": "On inverse chaque comparaison (≤ devient >) et on échange et ⟷ ou.", "a": 0}, {"q": "Avant de calculer un produit dans une boucle, p vaut…", "o": ["1", "0", "la première valeur", "rien"], "why": "Avec 0, le produit resterait toujours 0.", "a": 0}, {"q": "Combien de tours fait <code>for i in range(2, 10, 3)<\/code> ?", "o": ["3", "2", "4", "8"], "why": "i prend 2, 5, 8. 11 dépasse 10 : on s'arrête.", "a": 0}, {"q": "Avec n = 0, combien de tours fait <code>Tantque n ≠ 0 Faire<\/code> ?", "o": ["0", "1", "une infinité", "une erreur"], "why": "Le test est fait avant le premier tour : il est faux tout de suite.", "a": 0}, {"q": "Le Selon de l'algorithme se traduit en Python par…", "o": ["if / elif / else", "switch", "for", "while"], "why": "Python n'a pas de switch : on enchaîne if, elif, else (ou match depuis 3.10).", "a": 0}], "fill": [{"title": "Somme des chiffres de n, en Python", "lang": "py", "src": "s = [[0]]\nwhile n [[!=]] 0:\n    s = s + n [[%]] 10\n    n = n [[//]] 10"}, {"title": "Contrôle de saisie, en algorithme", "lang": "algo", "src": "[[Répéter]]\n    Ecrire(\"n entre 5 et 20 : \")\n    [[Lire(n)|Lire (n)]]\n[[Jusqu'à]] (5 ≤ n) [[et]] (n ≤ 20)"}, {"title": "Afficher les nombres de 10 à 1", "lang": "py", "src": "for i in range([[10]], [[0]], [[-1]]):\n    print(i, end=\" \")"}], "trace": [{"title": "Que vaut s à la fin ?", "lang": "algo", "src": "s ← 0\nPour i de 1 à 4 Faire\n    s ← s + i * i\nFinPour\nEcrire(s)", "py": "s = 0\nfor i in range(1, 5):\n    s = s + i * i\nprint(s)", "ans": "30", "why": "1 + 4 + 9 + 16 = 30."}, {"title": "Qu'affiche ce programme ?", "lang": "py", "src": "n = 1234\ns = 0\nwhile n != 0:\n    s = s * 10 + n % 10\n    n = n // 10\nprint(s)", "ans": "4321", "why": "À chaque tour on décolle le dernier chiffre de n et on le colle à droite de s : c'est l'inverse de n."}, {"title": "Qu'affiche ce programme ?", "lang": "py", "src": "for i in range(5, 0, -2):\n    print(i, end=\" \")", "ans": "5 3 1", "why": "On part de 5, on retire 2 à chaque tour, et 0 est exclu (−1 aussi)."}, {"title": "Qu'affiche ce programme ?", "lang": "py", "src": "x = 7\nif x % 2 == 0:\n    print(\"pair\")\nelif x > 5:\n    print(\"grand\")\nelse:\n    print(\"petit\")", "ans": "grand", "why": "7 n'est pas pair, le premier test est faux. 7 > 5 est vrai : on affiche grand et on s'arrête."}], "parsons": [{"title": "Remets dans l'ordre : somme des chiffres de n", "lang": "algo", "lines": ["s ← 0", "Tantque n ≠ 0 Faire", "    s ← s + n mod 10", "    n ← n div 10", "FinTantque", "Ecrire(s)"]}]}, {"id": "modules", "n": 3, "title": "Fonctions et procédures", "short": "Fonctions, procédures", "goal": "Écrire l'entête juste, déclarer le T.D.O.L et passer correctement les paramètres (@ et global).", "lesson": [{"t": "table", "head": ["", "Fonction", "Procédure"], "rows": [["<b>Rôle<\/b>", "retourne <b>un<\/b> résultat simple", "fait une action, ou rend 0 ou plusieurs résultats"], ["<b>Entête<\/b>", "<code>FONCTION F (…) : Type<\/code>, terminée par <code>Retourner<\/code>", "<code>PROCEDURE P (…)<\/code>, sans Retourner"], ["<b>Appel<\/b>", "dans une expression : <code>x ← F(n)<\/code>", "seul sur sa ligne : <code>P(T, n)<\/code>"], ["<b>Python<\/b>", "<code>def f(…):<\/code> … <code>return x<\/code>", "<code>def p(…):<\/code> + <code>global n<\/code> pour un @ simple"]]}, {"t": "boxes", "items": [{"k": "coeur", "title": "paramètres", "html": "Appel et entête se correspondent par le <b>nombre<\/b>, l'<b>ordre<\/b> et le <b>type<\/b>. <b>Formels<\/b> : dans l'entête. <b>Effectifs<\/b> : dans l'appel.<br><b>Par valeur<\/b> <code>n : Entier<\/code> : le module utilise n. <b>Par adresse<\/b> <code>@n : Entier<\/code> : le module modifie n."}, {"k": "cours", "title": "le @ en Python", "html": "Méthode du cours : le paramètre <b>sort<\/b> de l'entête et devient <code>global n<\/code> dans le module. L'appel se fait sans lui : <code>saisir()<\/code>. Un tableau passé en paramètre est modifié directement."}, {"k": "coeur", "title": "global ou local", "html": "<b>Global<\/b> : déclaré dans le programme principal (T.D.O.G), connu partout. <b>Local<\/b> : déclaré dans un module (T.D.O.L), connu de lui seul."}, {"k": "piege", "title": "le T.D.O.L", "html": "Les paramètres ne se déclarent <b>pas<\/b> dans le T.D.O.L. Évite Lire et Ecrire dans une fonction : elle reçoit par ses paramètres et rend par Retourner."}]}, {"t": "table", "head": ["L'énoncé dit…", "Tu écris", "En Python"], "rows": [["« saisir n tel que… »", "<code>PROCEDURE Saisir (@n : Entier)<\/code>", "<code>global n<\/code>"], ["« calculer, compter, déterminer »", "<code>FONCTION F (…) : Entier<\/code>", "<code>return<\/code>"], ["« vérifier si…, tester si… »", "<code>FONCTION F (…) : Booléen<\/code>", "<code>return test<\/code>"], ["« remplir, trier » un tableau", "<code>PROCEDURE P (@T : Tab ; n : Entier)<\/code>", "t modifié sur place"], ["« afficher »", "<code>PROCEDURE P (T : Tab ; n : Entier)<\/code>", "<code>print<\/code>"]], "title": "Fonction ou procédure ?"}, {"t": "mod", "num": "M1", "title": "Saisir un entier n avec une fonction", "kind": "fonction → entier", "algo": "FONCTION Saisir () : Entier\nDEBUT\n    Ecrire(\"saisir un entier : \")\n    Lire(n)\n    Retourner n\nFIN\n# appel dans le pp\nn ← Saisir()", "py": "def saisir():\n    n = int(input(\"saisir un entier : \"))\n    return n\n\n# appel dans le pp\nn = saisir()", "td": [["n", "Entier"]]}, {"t": "mod", "num": "M1′", "title": "Saisir un entier n avec une procédure", "kind": "procédure · @n", "algo": "PROCEDURE Saisir (@n : Entier)\nDEBUT\n    Ecrire(\"saisir un entier : \")\n    Lire(n)\nFIN\n# appel dans le pp\nSaisir(n)", "py": "def saisir():\n    global n\n    n = int(input(\"saisir un entier : \"))\n\n# appel dans le pp\nsaisir()"}, {"t": "mod", "num": "M1″", "title": "Saisir un entier 1 ≤ n ≤ 10 avec une procédure", "kind": "procédure · contrôle", "note": "S'il y a une condition de saisie, il faut une boucle Répéter… Jusqu'à.", "algo": "PROCEDURE Saisir (@n : Entier)\nDEBUT\n    Répéter\n        Ecrire(\"saisir un entier : \")\n        Lire(n)\n    Jusqu'à (1 ≤ n) et (n ≤ 10)\nFIN\n# appel dans le pp\nSaisir(n)", "py": "def saisir():\n    global n\n    test = False\n    while test == False:\n        n = int(input(\"saisir un entier : \"))\n        if 1 <= n <= 10:\n            test = True\n\n# ou, plus court :\ndef saisir():\n    global n\n    n = int(input(\"saisir un entier : \"))\n    while not (1 <= n <= 10):\n        n = int(input(\"saisir un entier : \"))", "cons": "saisir un entier : 0\nsaisir un entier : 14\nsaisir un entier : 7"}], "quiz": [{"q": "Un module qui retourne <b>un seul<\/b> résultat simple est…", "o": ["une fonction", "une procédure", "un programme principal", "un T.D.O.L"], "why": "Une fonction rend un résultat par Retourner et s'appelle dans une expression.", "a": 0}, {"q": "Dans <code>PROCEDURE Saisir (@n : Entier)<\/code>, le @ veut dire…", "o": ["n est passé par adresse : le module le modifie", "n est passé par valeur", "n est un tableau", "n est un objet local"], "why": "Par adresse : la modification faite dans le module est visible dans le programme principal.", "a": 0}, {"q": "Avec la méthode du cours, le @n de Saisir devient en Python…", "o": ["global n dans le module, et l'appel saisir()", "def saisir(@n):", "return n obligatoirement", "n = None"], "why": "Le paramètre sort de l'entête et devient global n.", "a": 0}, {"q": "Où déclare-t-on les objets locaux d'un module ?", "o": ["dans son T.D.O.L", "dans le T.D.O.G", "dans le T.D.N.T", "dans son entête"], "why": "T.D.O.L = tableau de déclaration des objets <b>locaux<\/b>.", "a": 0}, {"q": "Les paramètres d'un module se déclarent-ils dans son T.D.O.L ?", "o": ["Non", "Oui"], "why": "Ils sont déjà déclarés dans l'entête, avec leur type.", "a": 0}, {"q": "Quel appel de la fonction F est correct ?", "o": ["x ← F(n)", "F(n) seul sur sa ligne", "F ← n", "Saisir F(n)"], "why": "Une fonction rend une valeur : on l'utilise dans une expression, par exemple une affectation.", "a": 0}, {"q": "« Vérifier si n est premier » : quel entête ?", "o": ["FONCTION Premier (n : Entier) : Booléen", "PROCEDURE Premier (@n : Entier)", "FONCTION Premier (n : Entier) : Entier", "PROCEDURE Premier (n : Entier)"], "why": "Vérifier rend Vrai ou Faux : une fonction de type Booléen. n n'est pas modifié : pas de @.", "a": 0}, {"q": "Les paramètres <b>effectifs<\/b> se trouvent…", "o": ["dans l'appel", "dans l'entête", "dans le T.D.O.L", "dans le T.D.N.T"], "why": "Formels : dans l'entête. Effectifs : dans l'appel.", "a": 0}, {"q": "« Afficher un tableau T de taille n » : quel entête ?", "o": ["PROCEDURE Afficher (T : Tab ; n : Entier)", "PROCEDURE Afficher (@T : Tab ; n : Entier)", "FONCTION Afficher (T : Tab) : Tab", "FONCTION Afficher (n : Entier) : Chaîne"], "why": "Afficher ne modifie pas T : pas de @. Il ne rend rien : procédure.", "a": 0}, {"q": "Que fait Python avec <code>def saisir(n):<\/code> suivi de <code>global n<\/code> ?", "o": ["Il refuse : n ne peut pas être à la fois paramètre et global", "Il fonctionne normalement", "Il ignore global", "Il crée deux variables n"], "why": "SyntaxError : name 'n' is parameter and global. Avec global, n sort de l'entête.", "a": 0}], "fill": [{"title": "M1″ en Python : saisir 1 ≤ n ≤ 10", "lang": "py", "src": "def saisir():\n    [[global]] n\n    n = int(input(\"saisir un entier : \"))\n    while [[not]] (1 <= n <= 10):\n        n = int(input(\"saisir un entier : \"))\n\n# appel dans le pp\n[[saisir()]]"}, {"title": "M1 en algorithme : saisir avec une fonction", "lang": "algo", "src": "[[FONCTION]] Saisir () : [[Entier]]\nDEBUT\n    Ecrire(\"saisir un entier : \")\n    Lire(n)\n    [[Retourner]] n\nFIN\n# appel dans le pp\nn [[←]] Saisir()"}], "trace": [{"title": "Qu'affiche ce programme ?", "lang": "py", "src": "def f(a, b):\n    return a * 2 + b\n\nx = f(3, 1)\nprint(f(x, x))", "ans": "21", "why": "x = 3 × 2 + 1 = 7, puis f(7, 7) = 14 + 7 = 21."}, {"title": "Qu'affiche ce programme ?", "lang": "py", "src": "def g():\n    global n\n    n = n + 5\n\nn = 10\ng()\ng()\nprint(n)", "ans": "20", "why": "Grâce à global, chaque appel modifie le n du programme principal : 10, 15, 20."}], "parsons": [{"title": "Remets dans l'ordre : M1″ en algorithme", "lang": "algo", "lines": ["PROCEDURE Saisir (@n : Entier)", "DEBUT", "    Répéter", "        Ecrire(\"saisir un entier : \")", "        Lire(n)", "    Jusqu'à (1 ≤ n) et (n ≤ 10)", "FIN"]}]}, {"id": "entiers", "n": 4, "title": "Modules utiles sur les entiers", "short": "Entiers", "goal": "Savoir écrire de mémoire M2 à M7 : puissance, factoriel, diviseurs, plus grand chiffre, chiffres triés, premier.", "lesson": [{"t": "boxes", "items": [{"k": "coeur", "title": "deux patrons", "html": "<b>Accumuler<\/b> avec Pour : on initialise (0 pour une somme ou un compteur, 1 pour un produit), puis on met à jour à chaque tour.<br><b>Vérifier<\/b> avec Tant que : on avance tant que tout va bien, puis on regarde <b>où<\/b> on s'est arrêté."}]}, {"t": "mod", "num": "M2", "title": "Calculer a<sup>b<\/sup>", "kind": "fonction → entier", "algo": "FONCTION Puissance (a, b : Entier) : Entier\nDEBUT\n    p ← 1\n    Pour i de 1 à b Faire\n        p ← p * a\n    FinPour\n    Retourner p\nFIN", "py": "def puissance(a, b):\n    p = 1\n    for i in range(1, b + 1):  # ou range(b)\n        p = p * a\n    return p", "td": [["p", "Entier"], ["i", "Entier"]], "cons": ">>> puissance(2, 10)\n1024"}, {"t": "mod", "num": "M3", "title": "Calculer n! = 1 × 2 × … × n", "kind": "fonction → entier", "algo": "FONCTION Factoriel (n : Entier) : Entier\nDEBUT\n    f ← 1\n    Pour i de 2 à n Faire\n        f ← f * i\n    FinPour\n    Retourner f\nFIN", "py": "def factoriel(n):\n    f = 1\n    for i in range(2, n + 1):\n        f = f * i\n    return f", "td": [["f", "Entier"], ["i", "Entier"]], "cons": ">>> factoriel(5)\n120"}, {"t": "mod", "num": "M4", "title": "Compter les diviseurs de n", "kind": "fonction → entier", "algo": "FONCTION Nbr_div (n : Entier) : Entier\nDEBUT\n    nb ← 0\n    Pour i de 1 à n Faire\n        Si n mod i = 0 Alors\n            nb ← nb + 1\n        FinSi\n    FinPour\n    Retourner nb\nFIN", "py": "def nbr_div(n):\n    nb = 0\n    for i in range(1, n + 1):\n        if n % i == 0:\n            nb = nb + 1   # ou nb += 1\n    return nb", "td": [["nb", "Entier"], ["i", "Entier"]], "cons": ">>> nbr_div(12)   # 1 2 3 4 6 12\n6"}, {"t": "mod", "num": "M5", "title": "Le plus grand chiffre de n", "kind": "fonction → entier", "algo": "FONCTION Max (n : Entier) : Entier\nDEBUT\n    ch ← convch(n)\n    M ← ch[0]\n    Pour i de 1 à long(ch) - 1 Faire\n        Si ch[i] > M Alors\n            M ← ch[i]\n        FinSi\n    FinPour\n    Retourner valeur(M)\nFIN", "py": "def max_chiffre(n):\n    ch = str(n)\n    M = ch[0]\n    for i in range(1, len(ch)):\n        if ch[i] > M:\n            M = ch[i]\n    return int(M)", "td": [["M", "Caractère"], ["i", "Entier"], ["ch", "Chaîne"]], "cons": ">>> max_chiffre(4728)\n8", "note": "Le cours l'appelle max : en Python ce nom écrase la fonction max() déjà existante, d'où max_chiffre."}, {"t": "mod", "num": "M6", "title": "Les chiffres de a sont-ils triés par ordre croissant ?", "kind": "fonction → booléen", "algo": "FONCTION Verif_Trier (a : Entier) : Booléen\nDEBUT\n    ch ← convch(a)\n    i ← 0\n    Tantque (i < long(ch) - 1) et (ch[i] ≤ ch[i + 1]) Faire\n        i ← i + 1\n    FinTantque\n    Retourner i = long(ch) - 1\nFIN", "py": "def verif_trier(a):\n    ch = str(a)\n    i = 0\n    while i < len(ch) - 1 and ch[i] <= ch[i + 1]:\n        i = i + 1\n    return i == len(ch) - 1", "td": [["i", "Entier"], ["ch", "Chaîne"]], "cons": ">>> verif_trier(1337)\nTrue\n>>> verif_trier(1324)\nFalse"}, {"t": "mod", "num": "M7", "title": "n (n > 1) est-il premier ?", "kind": "fonction → booléen", "algo": "FONCTION Verif_premier (n : Entier) : Booléen\nDEBUT\n    K ← Vrai\n    i ← 2\n    Tantque K et (i ≤ n div 2) Faire\n        Si n mod i ≠ 0 Alors\n            i ← i + 1\n        Sinon\n            K ← Faux\n        FinSi\n    FinTantque\n    Retourner K\nFIN", "py": "def verif_premier(n):\n    k = True\n    i = 2\n    while i <= n // 2 and k:\n        if n % i != 0:\n            i = i + 1\n        else:\n            k = False\n    return k", "td": [["i", "Entier"], ["K", "Booléen"]], "cons": ">>> verif_premier(13)\nTrue"}, {"t": "pair", "title": "M7 · version 2", "sub": "sans variable booléenne", "algo": "i ← 2\nTantque (i ≤ n div 2) et (n mod i ≠ 0) Faire\n    i ← i + 1\nFinTantque\nRetourner i > n div 2", "py": "i = 2\nwhile i <= n // 2 and n % i != 0:\n    i = i + 1\nreturn i > n // 2"}, {"t": "pair", "title": "M7 · version 3", "sub": "en comptant les diviseurs, idée du M4", "algo": "Nb ← 0\nPour i de 1 à n Faire\n    Si n mod i = 0 Alors\n        Nb ← Nb + 1\n    FinSi\nFinPour\nRetourner Nb = 2", "py": "nb = 0\nfor i in range(1, n + 1):\n    if n % i == 0:\n        nb += 1\nreturn nb == 2"}, {"t": "boxes", "items": [{"k": "piege", "title": "M7 et le nombre 1", "html": "Le M7 suppose <b>n &gt; 1<\/b> : pour 0 et 1 la boucle ne tourne pas et il répond Vrai. Si l'énoncé ne le garantit pas, démarre avec <code>K ← (n ≥ 2)<\/code>. La version 3 répond juste pour tout n ≥ 1."}, {"k": "piege", "title": "M5 compare des caractères", "html": "<code>\"7\" &gt; \"4\"<\/code> marche car les chiffres se suivent dans le code ASCII. N'oublie pas <code>valeur(M)<\/code> à la fin pour rendre un entier."}]}], "quiz": [{"q": "Que retourne <code>puissance(3, 0)<\/code> ?", "o": ["1", "0", "3", "une erreur"], "why": "La boucle ne tourne pas : p garde sa valeur de départ, 1. Et a⁰ = 1.", "a": 0}, {"q": "Dans Factoriel, pourquoi la boucle commence-t-elle à 2 ?", "o": ["Multiplier par 1 ne change rien", "Sinon Python plante", "Parce que 0! = 0", "range l'exige"], "why": "f vaut déjà 1 : le tour i = 1 ne servirait à rien.", "a": 0}, {"q": "Que retourne <code>nbr_div(12)<\/code> ?", "o": ["6", "4", "5", "12"], "why": "1, 2, 3, 4, 6, 12 : six diviseurs.", "a": 0}, {"q": "Un nombre premier a exactement…", "o": ["2 diviseurs", "1 diviseur", "aucun diviseur", "n div 2 diviseurs"], "why": "1 et lui-même. C'est l'idée de la version 3 : <code>Retourner Nb = 2<\/code>.", "a": 0}, {"q": "Dans le M7, pourquoi chercher un diviseur seulement jusqu'à n div 2 ?", "o": ["Aucun diviseur de n autre que n ne dépasse n div 2", "Pour aller deux fois plus vite, même si c'est faux", "Parce que n est pair", "Parce que range l'impose"], "why": "Le plus   Retourner s\nFIN", "py": "def somme_div(n):\n    s = 0\n    for d in range(1, n // 2 + 1):\n        if n % d == 0:\n            s = s + d\n    return s", "cons": ">>> somme_div(28)\n28", "td": [["s", "Entier"], ["d", "Entier"]]}, {"t": "mod", "num": "B", "title": "Inverser un entier", "kind": "fonction → entier", "algo": "FONCTION Inverse (x : Entier) : Entier\nDEBUT\n    s ← 0\n    Tantque x ≠ 0 Faire\n        r ← x mod 10\n        s ← s * 10 + r\n        x ← x div 10\n    FinTantque\n    Retourner s\nFIN", "py": "def inverse_nb(x):\n    s = 0\n    while x != 0:\n        r = x % 10\n        s = s * 10 + r\n        x = x // 10\n    return s", "cons": ">>> inverse_nb(472)\n274", "td": [["s", "Entier"], ["r", "Entier"]]}, {"t": "mod", "num": "C", "title": "PGCD (algorithme d'Euclide)", "kind": "fonction → entier", "algo": "FONCTION Pgcd (a, b : Entier) : Entier\nDEBUT\n    Tantque b ≠ 0 Faire\n        r ← a mod b\n        a ← b\n        b ← r\n    FinTantque\n    Retourner a\nFIN", "py": "def pgcd(a, b):\n    while b != 0:\n        r = a % b\n        a = b\n        b = r\n    return a", "cons": ">>> pgcd(84, 36)\n12", "td": [["r", "Entier"]]}, {"t": "mod", "num": "D", "title": "Facteurs premiers : 12 donne 2*2*3", "kind": "fonction → chaîne", "algo": "FONCTION Facteurs (n : Entier) : Chaîne\nDEBUT\n    ch ← \"\"\n    d ← 2\n    Tantque n ≠ 1 Faire\n        Si n mod d = 0 Alors\n            ch ← ch + convch(d) + \"*\"\n            n ← n div d\n        Sinon\n            d ← d + 1\n        FinSi\n    FinTantque\n    Retourner sous_chaîne(ch, 0, long(ch) - 1)\nFIN", "py": "def facteurs(n):\n    ch = \"\"\n    d = 2\n    while n != 1:\n        if n % d == 0:\n            ch = ch + str(d) + \"*\"\n            n = n // d\n        else:\n            d = d + 1\n    return ch[0:len(ch) - 1]", "cons": ">>> facteurs(12)\n'2*2*3'", "td": [["ch", "Chaîne"], ["d", "Entier"]]}, {"t": "mod", "num": "E", "title": "Somme des chiffres", "kind": "fonction → entier", "note": "Même boucl ": "py", "src": "def som_chiffres(x):\n    s = 0\n    while x != 0:\n        s = s + x % 10\n        x = x // 10\n    return s\n\nprint(som_chiffres(9999))", "ans": "36", "why": "9 + 9 + 9 + 9."}, {"title": "Que retourne SommeDiv(12) ?", "lang": "py", "src": "def somme_div(n):\n    s = 0\n    for d in range(1, n // 2 + 1):\n        if n % d == 0:\n            s = s + d\n    return s\n\nprint(somme_div(12))", "ans": "16", "why": "1 + 2 + 3 + 4 + 6 = 16. 12 n'est pas parfait."}], "parsons": [{"title": "Remets dans l'ordre : B · Inverse en algorithme", "lang": "algo", "lines": ["FONCTION Inverse (x : Entier) : Entier", "DEBUT", "    s ← 0", "    Tantque x ≠ 0 Faire", "        r ← x mod 10", "        s ← s * 10 + r", "        x ← x div 10", "    FinTantque", "    Retourner s", "FIN"]}]}, {"id": "chaines", "n": 6, "title": "Caractères et chaînes", "short": "Chaînes", "goal": "Parcourir une chaîne pour compter, construire ou vérifier : M8 à M13.", "lesson": [{"t": "table", "head": ["Schéma", "Boucle", "Avant", "Dans la boucle", "Modules"], "rows": [["<b>Compter<\/b>", "Pour", "<code>nb ← 0<\/code>", "<code>Si … Alors nb ← nb + 1<\/code>", "M9, M10"], ["<b>Construire<\/b>", "Pour", "<code>ch1 ← \"\"<\/code>", "<code>ch1 ← ch[i] + ch1<\/code> pour inverser", "M11"], ["<b>Vérifier<\/b>", "Tant que", "<code>i ← 0<\/code>", "on avance tant que tout va bien", "M12, M13"]]}, {"t": "mod", "num": "M8", "title": "Nature d'un caractère c", "kind": "fonction → chaîne", "algo": "FONCTION Nature (c : Caractère) : Chaîne\nDEBUT\n    Si \"A\" ≤ c ≤ \"Z\" Alors\n        R ← \"majuscule\"\n    Sinon Si \"a\" ≤ c ≤ \"z\" Alors\n        R ← \"minuscule\"\n    Sinon Si \"0\" ≤ c ≤ \"9\" Alors\n        R ← \"chiffre\"\n    Sinon\n        R ← \"autre\"\n    FinSi\n    Retourner R\nFIN", "py": "def nature(c):\n    if \"A\" <= c <= \"Z\":\n        R = \"majuscule\"\n    elif \"a\" <= c <= \"z\":\n        R = \"minuscule\"\n    elif \"0\" <= c <= \"9\":\n        R = \"chiffre\"\n    else:\n "M12", "title": "Uniquement des lettres et des espaces ?", "kind": "fonction → booléen", "algo": "FONCTION Verif (ch : Chaîne) : Booléen\nDEBUT\n    i ← 0\n    Tantque (i < long(ch)) et\n        ((\"A\" ≤ majus(ch[i]) ≤ \"Z\") ou (ch[i] = \" \")) Faire\n        i ← i + 1\n    FinTantque\n    Retourner i = long(ch)\nFIN", "py": "def verif(ch):\n    i = 0\n    while i < len(ch) and (\"A\" <= ch[i].upper() <= \"Z\"\n                           or ch[i] == \" \"):\n        i = i + 1\n    return i == len(ch)", "td": [["i", "Entier"]], "cons": ">>> verif(\"Bac info\")\nTrue\n>>> verif(\"Bac 2027\")\nFalse"}, {"t": "mod", "num": "M13", "title": "ch est-elle un palindrome ? (elle, ici, radar)", "kind": "fonction → booléen", "algo": "FONCTION Palindrome (ch : Chaîne) : Booléen\nDEBUT\n    i ← 0\n    j ← long(ch) - 1\n    Répéter\n        K ← ch[i] = ch[j]\n        i ← i + 1\n        j ← j - 1\n    Jusqu'à (i ≥ j) ou (K = Faux)\n    Retourner K\nFIN", "py": "def palindrome(ch):\n    i = 0\n    j = len(ch) - 1\n    k = True\n    while i < j and k == True:\n        k = ch[i] == ch[j]\n        i = i + 1\n        j = j - 1\n    return k", "td": [["i, j", "Entier"], ["K", "Booléen"]], "cons": ">>> palindrome(\"radar\")\nTrue"}, {"t": "pair", "title": "M13 · version 2", "sub": "deux compteurs, sans booléen", "algo": "i ← 0\nj ← long(ch) - 1\nTantque (i < j) et (ch[i] = ch[j]) Faire\n    i ← i + 1\n    j ← j - 1\nFinTantque\nRetourner i ≥ j", "py": "i = 0\nj = len(ch) - 1\nwhile i < j and ch[i] == ch[j]:\n    i = i + 1\n    j = j - 1\nreturn i >= j"}, {"t": "pair", "title": "M13 · version 3", "sub": "un seul compteur", "algo": "i ← 0\nRépéter\n    K ← ch[i] = ch[long(ch) - 1 - i]\n    i ← i + 1\nJusqu'à (K = Faux) ou (i = long(ch) div 2)", "py": "i = 0\nn = len(ch)\nwhile i < n // 2 and ch[i] == ch[n - 1 - i]:\n    i = i + 1\nreturn i == n // 2"}, {"t": "boxes", "items": [{"k": "coeur", "title": "le miroir", "html": "Le caractère en face de <code>ch[i]<\/code> est <code>ch[long(ch) - 1 - i]<\/code>. On s'arrête au milieu : <code>long(ch) div 2<\/code> comparaisons suffisent."}, {"k": "coeur", "title": "les parenthèses du M12", "html": "Le <b>ou<\/b> est entre parenthèses : sans elles, <b>et<\/b> passe avant <b>ou<\/b> et le test change de sens."}, {"k": "piege", "title": "les accents", "html": "<code>\"é\"<\/code> n'est pas entre \"a\" et \"z\" : Nature(\"é\") donne <b>autre<\/b>."}]}], "quiz": [{"q": "Que retourne <code>Nature(\"é\")<\/code> ?", "o": ["\"autre\"", "\"minuscule\"", "\"majuscule\"", "\"chiffre\""], "why": "Le code de é est bien plus grand que celui de z : aucun des trois tests n'est vrai.", "a": 0}, {"q": "Que vaut <code>Occurrence(\"s\", \"assises\")<\/code> ?", "o": ["4", "3", "5", "2"], "why": "a-<b>s<\/b>-<b>s<\/b>-i-<b>s<\/b>-e-<b>s<\/b> : quatre s.", "a": 0}, {"q": "On parcourt ch de 0 à long(ch) - 1. Quelle instruction construit l'inverse ?", "o": ["ch1 ← ch[i] + ch1", "ch1 ← ch1 + ch[i]", "ch1 ← ch[i]", "ch1 ← ch1 + ch1"], "why": "On colle chaque nouveau caractère <b>devant<\/b> : le premier lu finit en dernier.", "a": 0}, {"q": "Que retourne <code>Verif(\"Bac 2027\")<\/code> (M12) ?", "o": ["Faux", "Vrai"], "why": "Le caractère \"2\" n'est ni une lettre ni un espace : la boucle s'arrête avant la fin.", "a": 0}, {"q": "Dans le M12, pourquoi des parenthèses autour du <b>ou<\/b> ?", "o": ["Parce que et passe avant ou", "Pour faire joli", "Parce que Python l'exige toujours", "Parce que ou passe avant et"], "why": "Sans elles, on calculerait (i < long(ch) et lettre) ou espace : un espace serait testé même après la fin.", "a": 0}, {"q": "Dans un palindrome, quel caractère est en face de <code>ch[i]<\/code> ?", "o": ["ch[long(ch) - 1 - i]", "ch[long(ch) - i]", "ch[i - 1]", "ch[long(ch) div 2]"], "why": "Pour i = 0, on veut le dernier : ch[long(ch) - 1].", "a": 0}, {"q": "Combien de comparaisons la version 3 du M13 fait-elle pour \"radar\" ?", "o": ["2", "5", "3", "4"], "why": "long(\"radar\") div 2 = 2 : r/r puis a/a. Le d du

const EXDATA = {"groups": [["serie1", "Série 1", "Instructions simples : calcul, chaînes, codes ASCII."], ["serie2", "Série 2", "Structures conditionnelles : Si, Sinon Si, Selon."], ["chapitre5", "Chapitre 5 · Sous-programmes", "Décomposer en modules, tableaux, paramètres."], ["sujets", "Sujets pratiques 1 à 12", "Le format du bac pratique : un programme Python complet."]], "ex": [{"id": "s1e1", "group": "serie1", "label": "Ex 1", "title": "Convertir des jours en années, semaines et jours", "enonce": "Lire un nombre de jours et l'écrire en années, semaines et jours (une année = 365 jours, une semaine = 7 jours).<br><b>Exemple :<\/b> 382 jours équivalent à 1 an(s), 2 semaine(s) et 3 jour(s).", "algo": "ALGORITHME Conversion\nDEBUT\n    Répéter\n        Ecrire(\"Nombre de jours : \")\n        Lire(nj)\n    Jusqu'à nj ≥ 0\n    a ← nj div 365\n    r ← nj mod 365\n    s ← r div 7\n    j ← r mod 7\n    Ecrire(nj, \" jours équivalent à : \", a, \" an(s), \", s, \" semaine(s) et \", j, \" jour(s)\")\nFIN", "td": [["nj, a, r, s, j", "Entier"]], "py": "nj = int(input(\"Nombre de jours : \"))\nwhile not nj >= 0:\n    nj = int(input(\"Nombre de jours : \"))\na = nj // 365\nr = nj % 365\ns = r // 7\nj = r % 7\nprint(nj, \"jours équivalent à :\", a, \"an(s),\", s, \"semaine(s) et\", j, \"jour(s)\")", "notes": ["Tout le calcul tient dans <b>div<\/b> et <b>mod<\/b> : div donne le nombre d'unités complètes, mod ce qui reste."], "his": []}, {"id": "s1e2", "group": "serie1", "label": "Ex 2", "title": "Somme des chiffres d'un entier de 4 chiffres", "enonce": "Lire un entier N de quatre chiffres (à contrôler) et afficher la somme de ses chiffres.<br><b>Exemples :<\/b> N = 4561 donne 4+5+6+1=16 · N = 3001 donne 3+0+0+1=4.", "algo": "ALGORITHME Somme_Chiffres\nDEBUT\n    Répéter\n        Ecrire(\"N = \")\n        Lire(N)\n    Jusqu'à (1000 ≤ N) et (N ≤ 9999)\n    m ← N div 1000\n    c ← (N div 100) mod 10\n    d ← (N div 10) mod 10\n    u ← N mod 10\n    s ← m + c + d + u\n    Ecrire(m, \"+\", c, \"+\", d, \"+\", u, \"=\", s)\nFIN", "td": [["N, m, c, d, u, s", "Entier"]], "py": "N = int(input(\"N = \"))\nwhile not (1000 <= N <= 9999):\n    N = int(input(\"N = \"))\nm = N // 1000\nc = (N // 100) % 10\nd = (N // 10) % 10\nu = N % 10\ns = m + c + d + u\nprint(str(m) + \"+\" + str(c) + \"+\" + str(d) + \"+\" + str(u) + \"=\" + str(s))", "notes": ["La prof a écrit « respecter les contraintes » : la saisie contrôlée <code>1000 ≤ N ≤ 9999<\/code> fait partie de la note.", "Pour isoler un chiffre : on enlève ce qui est à droite avec <b>div<\/b>, puis on garde le dernier avec <b>mod 10<\/b>."], "his": []}, {"id": "s1e3", "group": "serie1", "label": "Ex 3", "title": "Conjuguer un verbe du 1er groupe au présent", "enonce": "Lire un verbe du premier groupe (il se termine par « er ») et afficher sa conjugaison au présent, de « je » à « ils ». On ne traite pas les cas particuliers.<br><b>Exemple :<\/b> chanter donne je chante, tu chantes, il chante, nous chantons, vous chantez, ils chantent.", "algo": "ALGORITHME Conjugaison\nDEBUT\n    Répéter\n        Ecrire(\"Verbe : \")\n        Lire(v)\n    Jusqu'à (long(v) > 2) et (sous_chaîne(v, long(v) - 2, long(v)) = \"er\")\n    r ← sous_chaîne(v, 0, long(v) - 2)\n    Ecrire(\"je \", r, \"e\")\n    Ecrire(\"tu \", r, \"es\")\n    Ecrire(\"il \", r, \"e\")\n    Ecrire(\"nous \", r, \"ons\")\n    Ecrire(\"vous \", r, \"ez\")\n    Ecrire(\"ils \", r, \"ent\")\nFIN", "td": [["v, r", "Chaîne"]], "py": "v = input(\"Verbe : \")\nwhile not (len(v) > 2 and v[len(v) - 2:len(v)] == \"er\"):\n    v = input(\"Verbe : \")\nr = v[0:len(v) - 2]\nprint(\"je\", r + \"e\")\nprint(\"tu\", r + \"es\")\nprint(\"il\", r + \"e\")\nprint(\"nous\", r + \"ons\")\nprint(\"vous\", r + \"ez\")\nprint(\"ils\", r + \"ent\")", "notes": ["Le radical est le verbe sans ses deux dernières lettres : <code>sous_chaîne(v, 0, long(v) - 2)<\/code>."], "his": []}, {"id": "s1e4", "group": "serie1", "label": "Ex 4", "title": "Générer un code à partir d'une chaîne", "enonce": "La chaîne commence par une lettre et contient un seul espace (supposée bien saisie). Le code se forme ainsi : la 1<sup>re<\/sup> lettre en majuscule, puis le caractère qui suit l'espace décalé de la longueur de la chaîne dans le code ASCII, puis le code ASCII du dernier caractère.<br><b>Exemple :<\/b> « mon Code » : m devient M ; C (67) + 8 = 75, soit K ; le dernier caractère e vaut 101. Le code est <b>MK101<\/b>.", "algo": "ALGORITHME Code\nDEBUT\n    Ecrire(\"Chaîne : \")\n    Lire(ch)\n    p ← pos(\" \", ch)\n    c1 ← majus(ch[0])\n    c2 ← chr(ord(ch[p + 1]) + long(ch))\n    code ← c1 + c2 + convch(ord(ch[long(ch) - 1]))\n    Ecrire(\"le code est \", code)\nFIN", "td": [["ch, code", "Chaîne"], ["c1, c2", "Caractère"], ["p", "Entier"]], "py": "ch = input(\"Chaîne : \")\np = ch.find(\" \")\nc1 = ch[0].upper()\nc2 = chr(ord(ch[p + 1]) + len(ch))\ncode = c1 + c2 + str(ord(ch[len(ch) - 1]))\nprint(\"le code est\", code)", "notes": ["Trois fonctions prédéfinies font tout le travail : <code>pos<\/code> pour trouver l'espace, <code>ord<\/code>/<code>chr<\/code> pour passer du caractère au code et retour, <code>convch<\/code> pour coller un nombre à une chaîne."], "his": []}, {"id": "s2e1", "group": "serie2", "label": "Ex 1", "title": "Entier cubique", "enonce": "Un entier est cubique s'il est égal à la somme des cubes de ses trois chiffres : 153 = 1³ + 5³ + 3³. Lire un entier de trois chiffres et dire s'il est cubique. Afficher un message d'erreur s'il n'a pas trois chiffres.", "algo": "ALGORITHME Cubique\nDEBUT\n    Ecrire(\"n = \")\n    Lire(n)\n    Si (n ≥ 100) et (n ≤ 999) Alors\n        c ← n div 100\n        d ← (n div 10) mod 10\n        u ← n mod 10\n        Si c * c * c + d * d * d + u * u * u = n Alors\n            Ecrire(n, \" est cubique\")\n        Sinon\n            Ecrire(n, \" n'est pas cubique\")\n        FinSi\n    Sinon\n        Ecrire(\"Erreur : l'entier doit avoir trois chiffres\")\n    FinSi\nFIN", "td": [["n, c, d, u", "Entier"]], "py": "n = int(input(\"n = \"))\nif 100 <= n <= 999:\n    c = n // 100\n    d = (n // 10) % 10\n    u = n % 10\n    if c ** 3 + d ** 3 + u ** 3 == n:\n        print(n, \"est cubique\")\n    else:\n        print(n, \"n'est pas cubique\")\nelse:\n    print(\"Erreur : l'entier doit avoir trois chiffres\")", "notes": ["Ici l'énoncé demande un <b>message d'erreur<\/b>, pas une saisie contrôlée : c'est un Si, pas un Répéter.", "Les entiers cubiques à trois chiffres sont 153, 370, 371 et 407."], "his": []}, {"id": "s2e2", "group": "serie2", "label": "Ex 2", "title": "Le pluriel d'un mot", "enonce": "Afficher le pluriel d'un mot avec seulement ces règles : terminé par « u », on ajoute « x » (eau → eaux) ; terminé par « el », la fin devient « eux » (ciel → cieux) ; terminé par « al », la fin devient « aux » (animal → animaux) ; sinon on ajoute « s ».", "algo": "ALGORITHME Pluriel\nDEBUT\n    Ecrire(\"Mot : \")\n    Lire(m)\n    L ← long(m)\n    Si m[L - 1] = \"u\" Alors\n        p ← m + \"x\"\n    Sinon Si sous_chaîne(m, L - 2, L) = \"el\" Alors\n        p ← sous_chaîne(m, 0, L - 2) + \"eux\"\n    Sinon Si sous_chaîne(m, L - 2, L) = \"al\" Alors\n        p ← sous_chaîne(m, 0, L - 2) + \"aux\"\n    Sinon\n        p ← m + \"s\"\n    FinSi\n    Ecrire(p)\nFIN", "td": [["m, p", "Chaîne"], ["L", "Entier"]], "py": "m = input(\"Mot : \")\nL = len(m)\nif m[L - 1] == \"u\":\n    p = m + \"x\"\nelif m[L - 2:L] == \"el\":\n    p = m[0:L - 2] + \"eux\"\nelif m[L - 2:L] == \"al\":\n    p = m[0:L - 2] + \"aux\"\nelse:\n    p = m + \"s\"\nprint(p)", "notes": ["Les deux derniers caractères : <code>sous_chaîne(m, L - 2, L)<\/code>, en Python <code>m[L-2:L]<\/code>."], "his": []}, {"id": "s2e3", "group": "serie2", "label": "Ex 3", "title": "Divisible par 6 et par 7", "enonce": "Lire un entier et dire s'il est divisible par 6 et par 7.<br><b>Exemples :<\/b> 84 est divisible par 6 et par 7 · 50 est non divisible par 6 et 7.", "algo": "ALGORITHME Divisible\nDEBUT\n    Ecrire(\"n = \")\n    Lire(n)\n    Si (n mod 6 = 0) et (n mod 7 = 0) Alors\n        Ecrire(n, \" est divisible par 6 et par 7\")\n    Sinon\n        Ecrire(n, \" est non divisible par 6 et 7\")\n    FinSi\nFIN", "td": [["n", "Entier"]], "py": "n = int(input(\"n = \"))\nif n % 6 == 0 and n % 7 == 0:\n    print(n, \"est divisible par 6 et par 7\")\nelse:\n    print(n, \"est non divisible par 6 et 7\")", "notes": ["Comme 6 et 7 sont premiers entre eux, le test revient à <code>n mod 42 = 0<\/code>."], "his": []}, {"id": "s2e4", "group": "serie2", "label": "Ex 4", "title": "Résoudre Ax² + Bx + C = 0", "enonce": "Lire trois réels A, B et C et résoudre l'équation Ax² + Bx + C = 0 dans ℝ, en traitant tous les cas.", "algo": "ALGORITHME Equation\nDEBUT\n    Lire(A, B, C)\n    Si A = 0 Alors\n        Si B = 0 Alors\n            Si C = 0 Alors\n                Ecrire(\"Tout réel est solution\")\n            Sinon\n                Ecrire(\"Pas de solution\")\n            FinSi\n        Sinon\n            Ecrire(\"x = \", -C / B)\n        FinSi\n    Sinon\n        d ← B * B - 4 * A * C\n        Si d > 0 Alors\n            x1 ← (-B - racinecarré(d)) / (2 * A)\n            x2 ← (-B + racinecarré(d)) / (2 * A)\n            Ecrire(\"x1 = \", x1, \" et x2 = \", x2)\n        Sinon Si d = 0 Alors\n            Ecrire(\"x = \", -B / (2 * A))\n        Sinon\n            Ecrire(\"Pas de solution réelle\")\n        FinSi\n    FinSi\nFIN", "td": [["A, B, C, d, x1, x2", "Réel"]], "py": "from math import sqrt\n\nA = float(input(\"A = \"))\nB = float(input(\"B = \"))\nC = float(input(\"C = \"))\nif A == 0:\n    if B == 0:\n        if C == 0:\n            print(\"Tout réel est solution\")\n        else:\n            print(\"Pas de solution\")\n    else:\n        print(\"x =\", -C / B)\nelse:\n    d = B * B - 4 * A * C\n    if d > 0:\n        x1 = (-B - sqrt(d)) / (2 * A)\n        x2 = (-B + sqrt(d)) / (2 * A)\n        print(\"x1 =\", x1, \"et x2 =\", x2)\n    elif d == 0:\n        print(\"x =\", -B / (2 * A))\n    else:\n        print(\"Pas de solution réelle\")", "notes": ["Le cas <b>A = 0<\/b> est le piège : on ne peut pas diviser par 2A, l'équation devient Bx + C = 0.", "Réels : <code>float(input())<\/code>, et <code>from math import sqrt<\/code> en première ligne."], "his": []}, {"id": "s2e5", "group": "serie2", "label": "Ex 5", "title": "Voyelle ou consonne", "enonce": "Lire une lettre (à contrôler) et afficher s'il s'agit d'une voyelle ou d'une consonne.", "algo": "ALGORITHME Voyelle\nDEBUT\n    Répéter\n        Ecrire(\"Une lettre : \")\n        Lire(c)\n    Jusqu'à (long(c) = 1) et (\"A\" ≤ majus(c) ≤ \"Z\")\n    Si majus(c) ∈ {\"A\", \"E\", \"I\", \"O\", \"U\", \"Y\"} Alors\n        Ecrire(c, \" est une voyelle\")\n    Sinon\n        Ecrire(c, \" est une consonne\")\n    FinSi\nFIN", "td": [["c", "Caractère"]], "py": "c = input(\"Une lettre : \")\nwhile not (len(c) == 1 and \"A\" <= c.upper() <= \"Z\"):\n    c = input(\"Une lettre : \")\nif c.upper() in {\"A\", \"E\", \"I\", \"O\", \"U\", \"Y\"}:\n    print(c, \"est une voyelle\")\nelse:\n    print(c, \"est une consonne\")", "notes": ["<code>majus(c)<\/code> évite de tester majuscules et minuscules séparément.", "En Python, <code>input()<\/code> peut rendre plusieurs caractères : d'où le test <code>len(c) == 1<\/code>."], "his": []}, {"id": "s2e6", "group": "serie2", "label": "Ex 6", "title": "Nature d'un caractère", "enonce": "Lire un caractère et afficher sa nature : majuscule, minuscule, chiffre ou autre.", "algo": "ALGORITHME Nature\nDEBUT\n    Ecrire(\"Un caractère : \")\n    Lire(c)\n    Si \"A\" ≤ c ≤ \"Z\" Alors\n        Ecrire(\"majuscule\")\n    Sinon Si \"a\" ≤ c ≤ \"z\" Alors\n        Ecrire(\"minuscule\")\n    Sinon Si \"0\" ≤ c ≤ \"9\" Alors\n        Ecrire(\"chiffre\")\n    Sinon\n        Ecrire(\"autre\")\n    FinSi\nFIN", "td": [["c", "Caractère"]], "py": "c = input(\"Un caractère : \")\nif \"A\" <= c <= \"Z\":\n    print(\"majuscule\")\nelif \"a\" <= c <= \"z\":\n    print(\"minuscule\")\nelif \"0\" <= c <= \"9\":\n    print(\"chiffre\")\nelse:\n    print(\"autre\")", "notes": ["C'est le module M8 de ton cours, écrit ici directement dans le programme principal."], "his": []}, {"id": "s2e7", "group": "serie2", "label": "Ex 7", "title": "Chiffres dans l'ordre décroissant", "enonce": "Lire un entier n de deux chiffres et le réécrire en permutant ses chiffres pour qu'ils soient dans l'ordre décroissant.<br><b>Exemple :<\/b> n = 19 donne 91.", "algo": "ALGORITHME Decroissant\nDEBUT\n    Répéter\n        Ecrire(\"n = \")\n        Lire(n)\n    Jusqu'à (10 ≤ n) et (n ≤ 99)\n    d ← n div 10\n    u ← n mod 10\n    Si d ≥ u Alors\n        r ← n\n    Sinon\n        r ← u * 10 + d\n    FinSi\n    Ecrire(r)\nFIN", "td": [["n, d, u, r", "Entier"]], "py": "n = int(input(\"n = \"))\nwhile not (10 <= n <= 99):\n    n = int(input(\"n = \"))\nd = n // 10\nu = n % 10\nif d >= u:\n    r = n\nelse:\n    r = u * 10 + d\nprint(r)", "his": [], "notes": []}, {"id": "s2e8", "group": "serie2", "label": "Ex 8", "title": "Entier aléatoire de 4 chiffres et sa propriété", "enonce": "Tirer au hasard un entier de 4 chiffres et vérifier si la somme des chiffres des unités et des dizaines est égale au produit des chiffres des centaines et des milliers.<br><b>Exemples :<\/b> 2519 vérifie la propriété car 9 + 1 = 2 × 5 · 1025 ne la vérifie pas car 2 + 5 ≠ 1 × 0.", "algo": "ALGORITHME Propriete\nDEBUT\n    n ← aléa(1000, 9999)\n    m ← n div 1000\n    c ← (n div 100) mod 10\n    d ← (n div 10) mod 10\n    u ← n mod 10\n    Si u + d = c * m Alors\n        Ecrire(n, \" vérifie la propriété\")\n    Sinon\n        Ecrire(n, \" ne vérifie pas la propriété\")\n    FinSi\nFIN", "td": [["n, m, c, d, u", "Entier"]], "py": "from random import randint\n\nn = randint(1000, 9999)\nm = n // 1000\nc = (n // 100) % 10\nd = (n // 10) % 10\nu = n % 10\nif u + d == c * m:\n    print(n, \"vérifie la propriété\")\nelse:\n    print(n, \"ne vérifie pas la propriété\")", "notes": ["« Aléatoire » : <code>aléa(1000, 9999)<\/code>, en Python <code>randint(1000, 9999)<\/code> avec <code>from random import randint<\/code>. Les deux bornes sont incluses."], "his": []}, {"id": "s2e9", "group": "serie2", "label": "Ex 9", "title": "Pratique : la calculatrice", "enonce": "On donne un algorithme qui lit deux entiers a, b et un opérateur op, puis affiche a+b, a-b, a*b ou a/b selon op (« Opérateur invalide » sinon).<br>1. L'implémenter en Python. 2. Remplacer la structure Si généralisée par la structure à choix multiples. 3. a) Que se passe-t-il pour b = 0 et op = \"/\" ? b) Corriger cette erreur.", "algo": "ALGORITHME Calculatrice\nDEBUT\n    Ecrire(\"Saisir deux entiers \")\n    Lire(a, b)\n    Ecrire(\"Saisir un opérateur \")\n    Lire(op)\n    Selon op\n        \"+\" : Ecrire(a + b)\n        \"-\" : Ecrire(a - b)\n        \"*\" : Ecrire(a * b)\n        \"/\" : Si b ≠ 0 Alors\n                  Ecrire(a / b)\n              Sinon\n                  Ecrire(\"Division par zéro impossible\")\n              FinSi\n    Sinon\n        Ecrire(\"Opérateur invalide\")\n    FinSelon\nFIN", "td": [["a, b", "Entier"], ["op", "Caractère"]], "py": "print(\"Saisir deux entiers \")\na = int(input())\nb = int(input())\nop = input(\"Saisir un opérateur \")\nmatch op:\n    case \"+\":\n        print(a + b)\n    case \"-\":\n        print(a - b)\n    case \"*\":\n        print(a * b)\n    case \"/\":\n        if b != 0:\n            print(a / b)\n        else:\n            print(\"Division par zéro impossible\")\n    case _:\n        print(\"Opérateur invalide\")\n# 3a) Avec b = 0 et op = \"/\", le programme du sujet s'arrête sur l'erreur\n#     ZeroDivisionError: division by zero\n# 3b) On teste b != 0 avant de diviser (voir ci-dessus).", "notes": ["Question 2 : Selon se traduit par <code>match … case<\/code> (Python 3.10 et plus) ; <code>case _<\/code> joue le rôle du Sinon.", "Question 3a : Python lève <b>ZeroDivisionError<\/b> et le programme s'arrête. La réponse s'écrit en commentaire, après la fin du programme."], "his": []}, {"id": "c5a1", "group": "chapitre5", "label": "Activité 1", "title": "Remplir un tableau et calculer sa somme", "enonce": "Remplir un tableau T par N entiers strictement positifs (3 ≤ N ≤ 36), calculer la somme et afficher les éléments avec leur somme.<br><b>Exemple :<\/b> N = 5, T = 17, 14, 2, 22, 10 : le programme affiche 17 + 14 + 2 + 22 + 10 = 65.<br>1. Écrire l'algorithme du programme principal décomposé en modules. 2. Écrire les modules et leurs tableaux de déclaration.", "algo": "ALGORITHME Somme_Tableau\nDEBUT\n    Saisir(n)\n    Remplir(T, n)\n    Afficher(T, n)\nFIN\n\nPROCEDURE Saisir (@n : Entier)\nDEBUT\n    Répéter\n        Ecrire(\"N = \")\n        Lire(n)\n    Jusqu'à (3 ≤ n) et (n ≤ 36)\nFIN\n\nPROCEDURE Remplir (@T : Tab ; n : Entier)\nDEBUT\n    Pour i de 0 à n - 1 Faire\n        Répéter\n            Ecrire(\"T[\", i, \"] = \")\n            Lire(T[i])\n        Jusqu'à T[i] > 0\n    FinPour\nFIN\n\nFONCTION Somme (T : Tab ; n : Entier) : Entier\nDEBUT\n    s ← 0\n    Pour i de 0 à n - 1 Faire\n        s ← s + T[i]\n    FinPour\n    Retourner s\nFIN\n\nPROCEDURE Afficher (T : Tab ; n : Entier)\nDEBUT\n    ch ← convch(T[0])\n    Pour i de 1 à n - 1 Faire\n        ch ← ch + \" + \" + convch(T[i])\n    FinPour\n    Ecrire(ch, \" = \", Somme(T, n))\nFIN", "td": [["T.D.N.T", "Tab = Tableau de 36 Entier"], ["T.D.O.G : n", "Entier"], ["T.D.O.G : T", "Tab"], ["T.D.O.G : Saisir, Remplir, Afficher", "Procédure"], ["T.D.O.G : Somme", "Fonction"], ["T.D.O.L Remplir : i", "Entier"], ["T.D.O.L Somme : s, i", "Entier"], ["T.D.O.L Afficher : ch / i", "Chaîne / Entier"]], "py": "from numpy import array\n\ndef saisir():\n    global n\n    n = int(input(\"N = \"))\n    while not (3 <= n <= 36):\n        n = int(input(\"N = \"))\n\ndef remplir(t, n):\n    for i in range(n):\n        t[i] = int(input(\"T[\" + str(i) + \"] = \"))\n        while not t[i] > 0:\n            t[i] = int(input(\"T[\" + str(i) + \"] = \"))\n\ndef somme(t, n):\n    s = 0\n    for i in range(n):\n        s = s + t[i]\n    return s\n\ndef afficher(t, n):\n    ch = str(t[0])\n    for i in range(1, n):\n        ch = ch + \" + \" + str(t[i])\n    print(ch, \"=\", somme(t, n))\n\n# programme principal\nsaisir()\nt = array([int()] * n)\nremplir(t, n)\nafficher(t, n)", "notes": ["Afficher appelle Somme : un module peut en appeler un autre, à condition qu'il soit déclaré (T.D.O.G).", "« Strictement positifs » : <code>T[i] > 0<\/code>, pas ≥."], "his": []}, {"id": "c5a2", "group": "chapitre5", "label": "Activité 2", "title": "La somme magique", "enonce": "Remplir deux tableaux T1 et T2 par N1 et N2 entiers strictement positifs (3 ≤ N1 ≤ 36 et 3 ≤ N2 ≤ 36). On parle de <b>somme magique<\/b> si la somme de T1 est égale à celle de T2.<br><b>Exemple :<\/b> T1 = 3, 11, 8, 22, 66 et T2 = 8, 58, 44 : somme magique car 3+11+8+22+66 = 8+58+44 = 110.", "algo": "ALGORITHME Somme_Magique\nDEBUT\n    n1 ← Saisir()\n    Remplir(T1, n1)\n    n2 ← Saisir()\n    Remplir(T2, n2)\n    s1 ← Somme(T1, n1)\n    s2 ← Somme(T2, n2)\n    Si s1 = s2 Alors\n        Ecrire(\"somme magique car : \", Chaine(T1, n1), \" = \", Chaine(T2, n2), \" = \", s1)\n    Sinon\n        Ecrire(\"somme non magique car : \", Chaine(T1, n1), \" = \", s1, \" et \", Chaine(T2, n2), \" = \", s2)\n    FinSi\nFIN\n\nFONCTION Saisir () : Entier\nDEBUT\n    Répéter\n        Ecrire(\"N = \")\n        Lire(n)\n    Jusqu'à (3 ≤ n) et (n ≤ 36)\n    Retourner n\nFIN\n\nPROCEDURE Remplir (@T : Tab ; n : Entier)      # comme l'activité 1\nFONCTION Somme (T : Tab ; n : Entier) : Entier  # comme l'activité 1\n\nFONCTION Chaine (T : Tab ; n : Entier) : Chaîne\nDEBUT\n    ch ← convch(T[0])\n    Pour i de 1 à n - 1 Faire\n        ch ← ch + \"+\" + convch(T[i])\n    FinPour\n    Retourner ch\nFIN", "td": [["T.D.N.T", "Tab = Tableau de 36 Entier"], ["T.D.O.G : n1, n2, s1, s2", "Entier"], ["T.D.O.G : T1, T2", "Tab"], ["T.D.O.G : Saisir, Somme, Chaine", "Fonction"], ["T.D.O.G : Remplir", "Procédure"], ["T.D.O.L Saisir : n", "Entier"], ["T.D.O.L Chaine : ch / i", "Chaîne / Entier"]], "py": "from numpy import array\n\ndef saisir():\n    n = int(input(\"N = \"))\n    while not (3 <= n <= 36):\n        n = int(input(\"N = \"))\n    return n\n\ndef remplir(t, n):\n    for i in range(n):\n        t[i] = int(input(\"T[\" + str(i) + \"] = \"))\n        while not t[i] > 0:\n            t[i] = int(input(\"T[\" + str(i) + \"] = \"))\n\ndef somme(t, n):\n    s = 0\n    for i in range(n):\n        s = s + t[i]\n    return s\n\ndef chaine(t, n):\n    ch = str(t[0])\n    for i in range(1, n):\n        ch = ch + \"+\" + str(t[i])\n    return ch\n\n# programme principal\nn1 = saisir()\nt1 = array([int()] * n1)\nremplir(t1, n1)\nn2 = saisir()\nt2 = array([int()] * n2)\nremplir(t2, n2)\ns1 = somme(t1, n1)\ns2 = somme(t2, n2)\nif s1 == s2:\n    print(\"somme magique car :\", chaine(t1, n1), \"=\", chaine(t2, n2), \"=\", s1)\nelse:\n    print(\"somme non magique car :\", chaine(t1, n1), \"=\", s1, \"et\", chaine(t2, n2), \"=\", s2)", "notes": ["On lit deux tailles : une <b>fonction<\/b> Saisir est plus pratique qu'une procédure avec global, car on peut l'appeler pour n1 puis pour n2.", "Remplir et Somme sont réutilisés deux fois : c'est l'intérêt des modules."], "his": []}, {"id": "c5ap1", "group": "chapitre5", "label": "Application 1", "title": "Entiers frères", "enonce": "Deux entiers N1 et N2 sont <b>frères<\/b> si chaque chiffre de N1 apparaît au moins une fois dans N2 et inversement. Saisir deux entiers strictement positifs et dire s'ils sont frères.<br><b>Exemples :<\/b> 1164 et 614 sont frères · 459 et 5594 sont frères · 504 et 455 ne sont pas frères.", "algo": "ALGORITHME Freres\nDEBUT\n    n1 ← Saisir()\n    n2 ← Saisir()\n    Si Inclus(n1, n2) et Inclus(n2, n1) Alors\n        Ecrire(n1, \" et \", n2, \" sont frères\")\n    Sinon\n        Ecrire(n1, \" et \", n2, \" ne sont pas frères\")\n    FinSi\nFIN\n\nFONCTION Saisir () : Entier\nDEBUT\n    Répéter\n        Ecrire(\"Donner un entier > 0 : \")\n        Lire(x)\n    Jusqu'à x > 0\n    Retourner x\nFIN\n\nFONCTION Inclus (a, b : Entier) : Booléen\nDEBUT\n    ch1 ← convch(a)\n    ch2 ← convch(b)\n    i ← 0\n    Tantque (i < long(ch1)) et (pos(ch1[i], ch2) ≠ -1) Faire\n        i ← i + 1\n    FinTantque\n    Retourner i = long(ch1)\nFIN", "td": [["T.D.O.G : n1, n2", "Entier"], ["T.D.O.G : Saisir, Inclus", "Fonction"], ["T.D.O.L Saisir : x", "Entier"], ["T.D.O.L Inclus : ch1, ch2 / i", "Chaîne / Entier"]], "py": "def saisir():\n    x = int(input(\"Donner un entier > 0 : \"))\n    while not x > 0:\n        x = int(input(\"Donner un entier > 0 : \"))\n    return x\n\ndef inclus(a, b):\n    ch1 = str(a)\n    ch2 = str(b)\n    i = 0\n    while i < len(ch1) and ch2.find(ch1[i]) != -1:\n        i = i + 1\n    return i == len(ch1)\n\n# programme principal\nn1 = saisir()\nn2 = saisir()\nif inclus(n1, n2) and inclus(n2, n1):\n    print(n1, \"et\", n2, \"sont frères\")\nelse:\n    print(n1, \"et\", n2, \"ne sont pas frères\")", "notes": ["Un seul module Inclus, appelé deux fois en échangeant les paramètres : « et inversement » se règle en une ligne.", "<code>pos(c, ch) ≠ -1<\/code> veut dire « c est dans ch »."], "his": []}, {"id": "c5ap2", "group": "chapitre5", "label": "Application 2", "title": "Crypter un tableau de lettres", "enonce": "T est un tableau de N lettres majuscules (2 &lt; N &lt; 20). Pour crypter : convertir chaque caractère en code ASCII, permuter le chiffre des unités et celui des dizaines, prendre le caractère du nouveau code, le ranger dans un tableau TR, puis afficher TR.<br><b>Exemple :<\/b> \"A\" = 65, on permute en 56, qui correspond à \"8\". T = A Y S V T donne TR = 8 b &amp; D 0.", "algo": "ALGORITHME Cryptage\nDEBUT\n    Saisir(n)\n    Remplir(T, n)\n    Crypter(T, TR, n)\n    Afficher(TR, n)\nFIN\n\nPROCEDURE Saisir (@n : Entier)\nDEBUT\n    Répéter\n        Ecrire(\"N = \")\n        Lire(n)\n    Jusqu'à (2 < n) et (n < 20)\nFIN\n\nPROCEDURE Remplir (@T : Tab ; n : Entier)\nDEBUT\n    Pour i de 0 à n - 1 Faire\n        Répéter\n            Ecrire(\"T[\", i, \"] = \")\n            Lire(T[i])\n        Jusqu'à (long(T[i]) = 1) et (\"A\" ≤ T[i] ≤ \"Z\")\n    FinPour\nFIN\n\nPROCEDURE Crypter (T : Tab ; @TR : Tab ; n : Entier)\nDEBUT\n    Pour i de 0 à n - 1 Faire\n        code ← ord(T[i])\n        code ← (code mod 10) * 10 + code div 10\n        TR[i] ← chr(code)\n    FinPour\nFIN\n\nPROCEDURE Afficher (TR : Tab ; n : Entier)\nDEBUT\n    Pour i de 0 à n - 1 Faire\n        Ecrire(TR[i], \" \")\n    FinPour\nFIN", "td": [["T.D.N.T", "Tab = Tableau de 19 Caractère"], ["T.D.O.G : n", "Entier"], ["T.D.O.G : T, TR", "Tab"], ["T.D.O.G : Saisir, Remplir, Crypter, Afficher", "Procédure"], ["T.D.O.L Crypter : i, code", "Entier"]], "py": "from numpy import array\n\ndef saisir():\n    global n\n    n = int(input(\"N = \"))\n    while not (2 < n < 20):\n        n = int(input(\"N = \"))\n\ndef remplir(t, n):\n    for i in range(n):\n        t[i] = input(\"T[\" + str(i) + \"] = \")\n        while not (len(t[i]) == 1 and \"A\" <= t[i] <= \"Z\"):\n            t[i] = input(\"T[\" + str(i) + \"] = \")\n\ndef crypter(t, tr, n):\n    for i in range(n):\n        code = ord(t[i])\n        code = (code % 10) * 10 + code // 10\n        tr[i] = chr(code)\n\ndef afficher(tr, n):\n    for i in range(n):\n        print(tr[i], end=\" \")\n\n# programme principal\nsaisir()\nt = array([str] * n)\ntr = array([str] * n)\nremplir(t, n)\ncrypter(t, tr, n)\nafficher(tr, n)", "notes": ["Permuter les deux chiffres d'un nombre à deux chiffres : <code>(x mod 10) * 10 + x div 10<\/code>.", "Attention : \"P\" (80), \"Z\" (90), \"F\" (70)… donnent 8, 9, 7 : des caractères invisibles. L'énoncé ne le demande pas, mais c'est bon à savoir si l'affichage paraît vide."], "his": []}, {"id": "sj1", "group": "sujets", "label": "Sujet 1", "title": "Degré de ressemblance entre deux mots", "enonce": "DR = (nombre de caractères bien placés en commun / longueur du mot) × 100. Saisir une chaîne Ch non vide de majuscules, remplir un tableau T par N chaînes de majuscules (5 ≤ N ≤ 20) de même longueur que Ch, puis afficher le DR entre Ch et chaque élément de T.<br><b>Exemple :<\/b> Ch = EXAMENS, T = EXEMPLE, EXAMENS, EXAMINE, FORMULE, EXERCIC : 42.86, 100.00, 71.43, 14.29, 28.57.", "algo": "ALGORITHME Ressemblance\nDEBUT\n    Saisir_Ch(ch)\n    Saisir_N(n)\n    Remplir(T, n, ch)\n    Afficher(T, n, ch)\nFIN\n\nFONCTION Maj (x : Chaîne) : Booléen\nDEBUT\n    i ← 0\n    Tantque (i < long(x)) et (\"A\" ≤ x[i] ≤ \"Z\") Faire\n        i ← i + 1\n    FinTantque\n    Retourner (i = long(x)) et (x ≠ \"\")\nFIN\n\nPROCEDURE Saisir_Ch (@ch : Chaîne)\nDEBUT\n    Répéter\n        Ecrire(\"Taper une chaîne : \")\n        Lire(ch)\n    Jusqu'à Maj(ch)\nFIN\n\nPROCEDURE Saisir_N (@n : Entier)\nDEBUT\n    Répéter\n        Ecrire(\"N = \")\n        Lire(n)\n    Jusqu'à (5 ≤ n) et (n ≤ 20)\nFIN\n\nPROCEDURE Remplir (@T : Tab ; n : Entier ; ch : Chaîne)\nDEBUT\n    Pour i de 0 à n - 1 Faire\n        Répéter\n            Ecrire(\"T[\", i, \"] = \")\n            Lire(T[i])\n        Jusqu'à Maj(T[i]) et (long(T[i]) = long(ch))\n    FinPour\nFIN\n\nFONCTION DR (x, y : Chaîne) : Réel\nDEBUT\n    nb ← 0\n    Pour i de 0 à long(x) - 1 Faire\n        Si x[i] = y[i] Alors\n            nb ← nb + 1\n        FinSi\n    FinPour\n    Retourner nb / long(x) * 100\nFIN\n\nPROCEDURE Afficher (T : Tab ; n : Entier ; ch : Chaîne)\nDEBUT\n    Pour i de 0 à n - 1 Faire\n        Ecrire(\"dr(\", ch, \",\", T[i], \") = \", arrondi(DR(ch, T[i]) * 100) / 100)\n    FinPour\nFIN", "td": [["T.D.N.T", "Tab = Tableau de 20 Chaîne"], ["T.D.O.G : ch", "Chaîne"], ["T.D.O.G : n", "Entier"], ["T.D.O.G : T", "Tab"], ["T.D.O.L DR : nb, i", "Entier"], ["T.D.O.L Maj, Remplir, Afficher : i", "Entier"]], "py": "from numpy import array\n\ndef maj(x):\n    i = 0\n    while i < len(x) and \"A\" <= x[i] <= \"Z\":\n        i = i + 1\n    return i == len(x) and x != \"\"\n\ndef saisir_ch():\n    global ch\n    ch = input(\"Taper une chaîne : \")\n    while not maj(ch):\n        ch = input(\"Taper une chaîne : \")\n\ndef saisir_n():\n    global n\n    n = int(input(\"N = \"))\n    while not 5 <= n <= 20:\n        n = int(input(\"N = \"))\n\ndef remplir(t, n, ch):\n    for i in range(n):\n        t[i] = input(\"T[\" + str(i) + \"] = \")\n        while not (maj(t[i]) and len(t[i]) == len(ch)):\n            t[i] = input(\"T[\" + str(i) + \"] = \")\n\ndef dr(x, y):\n    nb = 0\n    for i in range(len(x)):\n        if x[i] == y[i]:\n            nb = nb + 1\n    return nb / len(x) * 100\n\ndef afficher(t, n, ch):\n    for i in range(n):\n        print(\"dr(\" + ch + \",\" + t[i] + \") =\", round(dr(ch, t[i]), 2))\n\n# programme principal\nsaisir_ch()\nsaisir_n()\nt = array([str] * n)\nremplir(t, n, ch)\nafficher(t, n, ch)", "his": ["sujet-1__1_.py", "controle__1_.py", "sujetM2__1_.py"], "notes": ["<b>Borne de N fausse :<\/b> l'énoncé dit 5 ≤ N ≤ 20, tes deux versions acceptent 2 ≤ N ≤ 20.", "<b>Affichage :<\/b> tu affiches <code>42.857142857142854<\/code> alors que l'énoncé veut <code>dr(EXAMENS,EXEMPLE) = 42.86<\/code>. Utilise <code>round(x, 2)<\/code> et écris le message comme dans l'exemple.", "Ta version 1 refait le calcul du DR dans <code>affiche<\/code> au lieu d'appeler un module : le barème compte la <b>modularité<\/b>, garde un module DR séparé comme dans ta version 2.", "Ta version 2 importe ses modules d'un autre fichier (<code>from controle import<\/code>). Au bac, rends <b>un seul fichier<\/b> avec tous les modules dedans.", "Bonne idée dans ta version 2 : <code>maj(x)<\/code> vérifie à la fois « non vide » et « que des majuscules »."]}, {"id": "sj2", "group": "sujets", "label": "Sujet 2", "title": "Les noms qui ont le plus de voyelles", "enonce": "Remplir un tableau T par les noms de N personnes (5 ≤ N ≤ 25) : chaînes non vides de majuscules, pouvant contenir des espaces, de 20 caractères au plus. Afficher les noms qui contiennent le plus grand nombre de voyelles.<br><b>Exemple :<\/b> BEN SALAH, AYADI, OMRANI, OUESLATI, BEN YOUSSEF, TLILI : le maximum est 5, on affiche OUESLATI et BEN YOUSSEF.", "algo": "ALGORITHME Voyelles\nDEBUT\n    n ← Saisir()\n    Remplir(T, n)\n    m ← Maxi(T, n)\n    Pour i de 0 à n - 1 Faire\n        Si Voy(T[i]) = m Alors\n            Ecrire(T[i])\n        FinSi\n    FinPour\nFIN\n\nFONCTION Saisir () : Entier\nDEBUT\n    Répéter\n        Ecrire(\"N = \")\n        Lire(n)\n    Jusqu'à (5 ≤ n) et (n ≤ 25)\n    Retourner n\nFIN\n\nFONCTION Valide (x : Chaîne) : Booléen\nDEBUT\n    i ← 0\n    Tantque (i < long(x)) et ((\"A\" ≤ x[i] ≤ \"Z\") ou (x[i] = \" \")) Faire\n        i ← i + 1\n    FinTantque\n    Retourner (i = long(x)) et (x ≠ \"\") et (long(x) ≤ 20)\nFIN\n\nPROCEDURE Remplir (@T : Tab ; n : Entier)\nDEBUT\n    Pour i de 0 à n - 1 Faire\n        Répéter\n            Ecrire(\"T[\", i, \"] = \")\n            Lire(T[i])\n        Jusqu'à Valide(T[i])\n    FinPour\nFIN\n\nFONCTION Voy (x : Chaîne) : Entier\nDEBUT\n    c ← 0\n    Pour i de 0 à long(x) - 1 Faire\n        Si pos(x[i], \"AEIOUY\") ≠ -1 Alors\n            c ← c + 1\n        FinSi\n    FinPour\n    Retourner c\nFIN\n\nFONCTION Maxi (T : Tab ; n : Entier) : Entier\nDEBUT\n    m ← Voy(T[0])\n    Pour i de 1 à n - 1 Faire\n        Si Voy(T[i]) > m Alors\n            m ← Voy(T[i])\n        FinSi\n    FinPour\n    Retourner m\nFIN", "td": [["T.D.N.T", "Tab = Tableau de 25 Chaîne"], ["T.D.O.G : n, m, i", "Entier"], ["T.D.O.G : T", "Tab"], ["T.D.O.L Voy : c, i", "Entier"], ["T.D.O.L Maxi : m, i", "Entier"]], "py": "from numpy import array\n\ndef saisir():\n    n = int(input(\"N = \"))\n    while not 5 <= n <= 25:\n        n = int(input(\"N = \"))\n    return n\n\ndef valide(x):\n    i = 0\n    while i < len(x) and (\"A\" <= x[i] <= \"Z\" or x[i] == \" \"):\n        i = i + 1\n    return i == len(x) and x != \"\" and len(x) <= 20\n\ndef remplir(t, n):\n    for i in range(n):\n        t[i] = input(\"T[\" + str(i) + \"] = \")\n        while not valide(t[i]):\n            t[i] = input(\"T[\" + str(i) + \"] = \")\n\ndef voy(x):\n    c = 0\n    for i in range(len(x)):\n        if \"AEIOUY\".find(x[i]) != -1:\n            c = c + 1\n    return c\n\ndef maxi(t, n):\n    m = voy(t[0])\n    for i in range(1, n):\n        if voy(t[i]) > m:\n            m = voy(t[i])\n    return m\n\n# programme principal\nn = saisir()\nt = array([str] * n)\nremplir(t, n)\nm = maxi(t, n)\nfor i in range(n):\n    if voy(t[i]) == m:\n        print(t[i])", "his": ["Sujet-2.py"], "notes": ["<b>Borne de N fausse :<\/b> l'énoncé dit 5 ≤ N ≤ 25, ton code s'arrête à 20 (tu as sans doute confondu avec les 20 caractères d'un nom).", "Dans ta boucle finale, <code>maxi(n, t)<\/code> est recalculé à chaque tour : calcule-le <b>une fois<\/b> avant la boucle (<code>m = maxi(t, n)<\/code>).", "Le reste est juste : <code>valide<\/code> vérifie bien non vide, majuscules et espaces, 20 caractères au plus, et Y compte comme voyelle (indispensable pour BEN YOUSSEF)."]}, {"id": "sj3", "group": "sujets", "label": "Sujet 3", "title": "Nombres Harshad à prédécesseur premier", "enonce": "Un nombre <b>Harshad<\/b> est divisible par la somme de ses chiffres (198 est divisible par 1+9+8 = 18). Saisir n et m (100 ≤ n &lt; m) et afficher les nombres Harshad de [n, m] dont le prédécesseur est premier.<br><b>Exemple :<\/b> n = 100, m = 150 : 102, 108, 110, 114, 132, 140, 150, chacun affiché sous la forme « 102 car 102 est Harshad et son prédécesseur 101 est un nombre premier ».", "algo": "ALGORITHME Harshad_Premier\nDEBUT\n    Saisir(n, m)\n    Pour i de n à m Faire\n        Si Harshad(i) et Premier(i - 1) Alors\n            Ecrire(i, \" car \", i, \" est Harshad et son prédécesseur \", i - 1, \" est un nombre premier\")\n        FinSi\n    FinPour\nFIN\n\nPROCEDURE Saisir (@n, @m : Entier)\nDEBUT\n    Répéter\n        Ecrire(\"N = \")\n        Lire(n)\n        Ecrire(\"M = \")\n        Lire(m)\n    Jusqu'à (n ≥ 100) et (n < m)\nFIN\n\nFONCTION Harshad (x : Entier) : Booléen\nDEBUT\n    ch ← convch(x)\n    s ← 0\n    Pour i de 0 à long(ch) - 1 Faire\n        s ← s + valeur(ch[i])\n    FinPour\n    Retourner x mod s = 0\nFIN\n\nFONCTION Premier (x : Entier) : Booléen\nDEBUT\n    nb ← 0\n    Pour i de 1 à x Faire\n        Si x mod i = 0 Alors\n            nb ← nb + 1\n        FinSi\n    FinPour\n    Retourner nb = 2\nFIN", "td": [["T.D.O.G : n, m, i", "Entier"], ["T.D.O.G : Saisir", "Procédure"], ["T.D.O.G : Harshad, Premier", "Fonction"], ["T.D.O.L Harshad : ch / s, i", "Chaîne / Entier"], ["T.D.O.L Premier : nb, i", "Entier"]], "py": "def saisir():\n    global n, m\n    n = int(input(\"N = \"))\n    m = int(input(\"M = \"))\n    while not (n >= 100 and n < m):\n        n = int(input(\"N = \"))\n        m = int(input(\"M = \"))\n\ndef harshad(x):\n    ch = str(x)\n    s = 0\n    for i in range(len(ch)):\n        s = s + int(ch[i])\n    return x % s == 0\n\ndef premier(x):\n    nb = 0\n    for i in range(1, x + 1):\n        if x % i == 0:\n            nb = nb + 1\n    return nb == 2\n\n# programme principal\nsaisir()\nfor i in range(n, m + 1):\n    if harshad(i) and premier(i - 1):\n        print(i, \"car\", i, \"est Harshad et son prédécesseur\", i - 1, \"est un nombre premier\")", "his": ["Sujet-3.py"], "notes": ["Ton programme est <b>juste<\/b> : il trouve exactement 102, 108, 110, 114, 132, 140, 150.", "<b>Message :<\/b> écris-le comme l'énoncé, au caractère près : « est Harshad » (pas « harchad ») et « est un nombre premier ».", "<code>n, m = int(input()), int(input())<\/code> marche, mais une saisie par ligne est plus lisible et se traduit directement en algorithme.", "<code>prem<\/code> compte tous les diviseurs (version 3 du M7) : c'est juste et il gère bien 1, qui n'est pas premier."]}, {"id": "sj4", "group": "sujets", "label": "Sujet 4", "title": "Crypter un mot selon le nombre d'occurrences", "enonce": "Pour chaque lettre d'un mot M non vide de majuscules : compter son nombre d'occurrences n dans M ; k = 2n si n est impair, k = n div 2 si n est pair ; remplacer la lettre par la k<sup>ième<\/sup> lettre qui la suit dans l'alphabet (après \"Z\" on reprend à \"A\").<br><b>Exemple :<\/b> HAPPY donne <b>JCQQA<\/b>.", "algo": "ALGORITHME Cryptage\nDEBUT\n    m ← Saisir()\n    Ecrire(Crypter(m))\nFIN\n\nFONCTION Verif (x : Chaîne) : Booléen\nDEBUT\n    i ← 0\n    Tantque (i < long(x)) et (\"A\" ≤ x[i] ≤ \"Z\") Faire\n        i ← i + 1\n    FinTantque\n    Retourner (i = long(x)) et (x ≠ \"\")\nFIN\n\nFONCTION Saisir () : Chaîne\nDEBUT\n    Répéter\n        Ecrire(\"Taper le mot à crypter : \")\n        Lire(ch)\n    Jusqu'à Verif(ch)\n    Retourner ch\nFIN\n\nFONCTION NbApp (c : Caractère ; ch : Chaîne) : Entier\nDEBUT\n    v ← 0\n    Pour i de 0 à long(ch) - 1 Faire\n        Si ch[i] = c Alors\n            v ← v + 1\n        FinSi\n    FinPour\n    Retourner v\nFIN\n\nFONCTION Crypter (m : Chaîne) : Chaîne\nDEBUT\n    r ← \"\"\n    Pour i de 0 à long(m) - 1 Faire\n        n ← NbApp(m[i], m)\n        Si n mod 2 = 0 Alors\n            k ← n div 2\n        Sinon\n            k ← 2 * n\n        FinSi\n        x ← ord(m[i]) + k\n        Tantque x > ord(\"Z\") Faire\n            x ← x - 26\n        FinTantque\n        r ← r + chr(x)\n    FinPour\n    Retourner r\nFIN", "td": [["T.D.O.G : m", "Chaîne"], ["T.D.O.G : Verif, Saisir, NbApp, Crypter", "Fonction"], ["T.D.O.L Crypter : r / i, n, k, x", "Chaîne / Entier"], ["T.D.O.L NbApp : v, i", "Entier"]], "py": "def verif(x):\n    i = 0\n    while i < len(x) and \"A\" <= x[i] <= \"Z\":\n        i = i + 1\n    return i == len(x) and x != \"\"\n\ndef saisir():\n    ch = input(\"Taper le mot à crypter : \")\n    while not verif(ch):\n        ch = input(\"Taper le mot à crypter : \")\n    return ch\n\ndef nbapp(c, ch):\n    v = 0\n    for i in range(len(ch)):\n        if ch[i] == c:\n            v = v + 1\n    return v\n\ndef crypter(m):\n    r = \"\"\n    for i in range(len(m)):\n        n = nbapp(m[i], m)\n        if n % 2 == 0:\n            k = n // 2\n        else:\n            k = 2 * n\n        x = ord(m[i]) + k\n        while x > ord(\"Z\"):\n            x = x - 26\n        r = r + chr(x)\n    return r\n\n# programme principal\nm = saisir()\nprint(crypter(m))", "his": ["Sujet-4.py"], "notes": ["<b>Mot vide accepté :<\/b> ta fonction <code>verif(\"\")<\/code> rend True, alors que l'énoncé exige un mot <b>non vide<\/b>. Ajoute <code>and x != \"\"<\/code>.", "Le cryptage est juste : HAPPY donne bien JCQQA. Ta boucle <code>while x not in range(ord(\"A\"), ord(\"Z\") + 1)<\/code> marche ; <code>while x > ord(\"Z\")<\/code> dit la même chose plus simplement, car x ne peut que dépasser vers le haut.", "<code>nbapp<\/code> est exactement le module M9 (Occurrence) de ton cours."]}, {"id": "sj5", "group": "sujets", "label": "Sujet 5", "title": "Les nombres oblongs", "enonce": "Un nombre est <b>oblong<\/b> s'il est le produit de deux entiers consécutifs : 12 = 3 × 4, 272 = 16 × 17, 1640 = 40 × 41 ; 21 ne l'est pas. Saisir N (2 ≤ N ≤ 10), remplir T par N entiers positifs et afficher ses nombres oblongs (sinon « Aucun nombre oblong dans T »).<br><b>Exemple :<\/b> T = 20, 10, 1056, 65, 272, 921, 1261, 17 : on affiche 20, 1056, 272.", "algo": "ALGORITHME Oblongs\nDEBUT\n    Saisir(n)\n    Remplir(T, n)\n    Afficher(T, n)\nFIN\n\nPROCEDURE Saisir (@n : Entier)\nDEBUT\n    Répéter\n        Ecrire(\"N = \")\n        Lire(n)\n    Jusqu'à (2 ≤ n) et (n ≤ 10)\nFIN\n\nPROCEDURE Remplir (@T : Tab ; n : Entier)\nDEBUT\n    Pour i de 0 à n - 1 Faire\n        Répéter\n            Ecrire(\"T[\", i, \"] = \")\n            Lire(T[i])\n        Jusqu'à T[i] > 0\n    FinPour\nFIN\n\nFONCTION Oblong (x : Entier) : Booléen\nDEBUT\n    i ← 1\n    Tantque i * (i + 1) < x Faire\n        i ← i + 1\n    FinTantque\n    Retourner i * (i + 1) = x\nFIN\n\nPROCEDURE Afficher (T : Tab ; n : Entier)\nDEBUT\n    ch ← \"\"\n    Pour i de 0 à n - 1 Faire\n        Si Oblong(T[i]) Alors\n            ch ← ch + convch(T[i]) + \" \"\n        FinSi\n    FinPour\n    Si ch = \"\" Alors\n        Ecrire(\"Aucun nombre oblong dans T\")\n    Sinon\n        Ecrire(\"Les nombres oblongs sont : \", ch)\n    FinSi\nFIN", "td": [["T.D.N.T", "Tab = Tableau de 10 Entier"], ["T.D.O.G : n", "Entier"], ["T.D.O.G : T", "Tab"], ["T.D.O.L Oblong : i", "Entier"], ["T.D.O.L Afficher : ch / i", "Chaîne / Entier"]], "py": "from numpy import array\n\ndef saisir():\n    global n\n    n = int(input(\"N = \"))\n    while not 2 <= n <= 10:\n        n = int(input(\"N = \"))\n\ndef remplir(t, n):\n    for i in range(n):\n        t[i] = int(input(\"T[\" + str(i) + \"] = \"))\n        while t[i] <= 0:\n            t[i] = int(input(\"T[\" + str(i) + \"] = \"))\n\ndef oblong(x):\n    i = 1\n    while i * (i + 1) < x:\n        i = i + 1\n    return i * (i + 1) == x\n\ndef afficher(t, n):\n    ch = \"\"\n    for i in range(n):\n        if oblong(t[i]):\n            ch = ch + \"\\n\" + str(t[i])\n    if ch == \"\":\n        print(\"Aucun nombre oblong dans T\")\n    else:\n        print(\"Les nombres oblongs sont :\", ch)\n\n# programme principal\nsaisir()\nt = array([int()] * n)\nremplir(t, n)\nafficher(t, n)", "his": ["sujet-5.py"], "notes": ["<b>Message :<\/b> l'énoncé veut exactement « Aucun nombre oblong dans T », tu affiches « aucun nombre oblong ».", "Ta procédure <code>saisir<\/code> lit N <b>et<\/b> remplit T : sépare-la en Saisir et Remplir, la modularité fait partie du barème.", "Ta fonction <code>obl<\/code> avec Tant que est la bonne : elle s'arrête dès que i(i+1) atteint x, au lieu d'essayer tous les i jusqu'à x comme ta version commentée."]}, {"id": "sj6", "group": "sujets", "label": "Sujet 6", "title": "Crypter un message par couples de lettres", "enonce": "Le message M est de longueur paire, formé de majuscules et d'espaces. On le découpe en blocs de deux caractères ; chaque caractère reçoit un entier (A = 0 … Z = 25, espace = 26) ; chaque couple (x1, x2) devient (y1, y2) avec y1 = (11·x1 + 3·x2) mod 27 et y2 = (7·x1 + 4·x2) mod 27 ; on retransforme y1 et y2 en caractères.<br><b>Exemple :<\/b> « A MODIFIER » donne <b>« YXMFD ZNOP »<\/b>.", "algo": "ALGORITHME Cryptage_Couples\nDEBUT\n    ch ← Saisir()\n    Ecrire(Crypter(ch))\nFIN\n\nFONCTION Verif (ch : Chaîne) : Booléen\nDEBUT\n    i ← 0\n    Tantque (i < long(ch)) et ((\"A\" ≤ ch[i] ≤ \"Z\") ou (ch[i] = \" \")) Faire\n        i ← i + 1\n    FinTantque\n    Retourner (i = long(ch)) et (long(ch) mod 2 = 0) et (ch ≠ \"\")\nFIN\n\nFONCTION Saisir () : Chaîne\nDEBUT\n    Répéter\n        Ecrire(\"Taper le message à crypter : \")\n        Lire(ch)\n    Jusqu'à Verif(ch)\n    Retourner ch\nFIN\n\nFONCTION Code1 (c : Caractère) : Entier\nDEBUT\n    Si c = \" \" Alors\n        Retourner 26\n    Sinon\n        Retourner ord(c) - 65\n    FinSi\nFIN\n\nFONCTION Code2 (x : Entier) : Caractère\nDEBUT\n    Si x = 26 Alors\n        Retourner \" \"\n    Sinon\n        Retourner chr(x + 65)\n    FinSi\nFIN\n\nFONCTION Couple (a, b : Caractère) : Chaîne\nDEBUT\n    x1 ← Code1(a)\n    x2 ← Code1(b)\n    y1 ← (11 * x1 + 3 * x2) mod 27\n    y2 ← (7 * x1 + 4 * x2) mod 27\n    Retourner Code2(y1) + Code2(y2)\nFIN\n\nFONCTION Crypter (ch : Chaîne) : Chaîne\nDEBUT\n    r ← \"\"\n    i ← 0\n    Tantque i < long(ch) Faire\n        r ← r + Couple(ch[i], ch[i + 1])\n        i ← i + 2\n    FinTantque\n    Retourner r\nFIN", "td": [["T.D.O.G : ch", "Chaîne"], ["T.D.O.G : tous les modules", "Fonction"], ["T.D.O.L Couple : x1, x2, y1, y2", "Entier"], ["T.D.O.L Crypter : r / i", "Chaîne / Entier"]], "py": "def verif(ch):\n    i = 0\n    while i < len(ch) and (\"A\" <= ch[i] <= \"Z\" or ch[i] == \" \"):\n        i = i + 1\n    return i == len(ch) and len(ch) % 2 == 0 and ch != \"\"\n\ndef saisir():\n    ch = input(\"Taper le message à crypter : \")\n    while not verif(ch):\n        ch = input(\"Retaper le message à crypter : \")\n    return ch\n\ndef code1(c):\n    if c == \" \":\n        return 26\n    else:\n        return ord(c) - 65\n\ndef code2(x):\n    if x == 26:\n        return \" \"\n    else:\n        return chr(x + 65)\n\ndef couple(a, b):\n    x1 = code1(a)\n    x2 = code1(b)\n    y1 = (11 * x1 + 3 * x2) % 27\n    y2 = (7 * x1 + 4 * x2) % 27\n    return code2(y1) + code2(y2)\n\ndef crypter(ch):\n    r = \"\"\n    for i in range(0, len(ch), 2):\n        r = r + couple(ch[i], ch[i + 1])\n    return r\n\n# programme principal\nprint(crypter(saisir()))", "his": ["sujet-6.py", "SUJET-6-M2.py"], "notes": ["Tes deux versions donnent bien « YXMFD ZNOP ».", "<b>Message vide accepté :<\/b> <code>verif(\"\")<\/code> rend True (longueur 0, paire). Ajoute <code>and ch != \"\"<\/code>.", "Petite coquille dans tes messages : « massage » au lieu de « message ».", "Ta version 2 construit la chaîne \"AB…Z \" et utilise <code>find<\/code> : c'est astucieux, mais la version 1 avec Code1 et Code2 se traduit plus directement en algorithme et montre mieux la modularité.", "<code>range(0, len(ch), 2)<\/code> avance de deux en deux : en algorithme, un Tant que avec <code>i ← i + 2<\/code>, ou un Pour de 0 à long(ch) div 2 - 1 avec l'indice 2*i."]}, {"id": "sj7", "group": "sujets", "label": "Sujet 7", "title": "Le jeu du pendu", "enonce": "Un premier joueur propose un mot de 5 à 20 lettres ; on efface l'écran ; on affiche le mot masqué (première et dernière lettres visibles, les autres remplacées par \"-\"). Le deuxième joueur propose des lettres (sans distinction majuscule/minuscule) ; chaque lettre trouvée est dévoilée partout où elle apparaît. Il a autant d'essais que la longueur du mot. Afficher « Bravo, vous avez gagné ! » ou « Désolé, vous avez perdu ! ».<br><b>Exemple :<\/b> Dresser : D-----r, puis D--ss-r après « s »…", "algo": "ALGORITHME Pendu\nDEBUT\n    m ← Saisir()\n    Effacer_Ecran()\n    Jeu(m)\nFIN\n\nFONCTION Verif (ch : Chaîne) : Booléen\nDEBUT\n    i ← 0\n    Tantque (i < long(ch)) et (\"A\" ≤ majus(ch[i]) ≤ \"Z\") Faire\n        i ← i + 1\n    FinTantque\n    Retourner (i = long(ch)) et (5 ≤ long(ch)) et (long(ch) ≤ 20)\nFIN\n\nFONCTION Saisir () : Chaîne\nDEBUT\n    Répéter\n        Ecrire(\"Taper le mot à deviner : \")\n        Lire(ch)\n    Jusqu'à Verif(ch)\n    Retourner ch\nFIN\n\nFONCTION Masquer (x : Chaîne) : Chaîne\nDEBUT\n    ch ← x[0]\n    Pour i de 1 à long(x) - 2 Faire\n        ch ← ch + \"-\"\n    FinPour\n    Retourner ch + x[long(x) - 1]\nFIN\n\nFONCTION Remplacer (c : Caractère ; ch1, ch2 : Chaîne) : Chaîne\nDEBUT\n    ch3 ← \"\"\n    Pour i de 0 à long(ch1) - 1 Faire\n        Si majus(ch1[i]) = majus(c) Alors\n            ch3 ← ch3 + ch1[i]\n        Sinon\n            ch3 ← ch3 + ch2[i]\n        FinSi\n    FinPour\n    Retourner ch3\nFIN\n\nPROCEDURE Jeu (m : Chaîne)\nDEBUT\n    m2 ← Masquer(m)\n    e ← long(m)\n    Tantque (m2 ≠ m) et (e > 0) Faire\n        Ecrire(\"Le mot à deviner est \", m2)\n        Ecrire(\"Il vous reste \", e, \" essai(s)\")\n        Ecrire(\"Proposer un caractère : \")\n        Lire(c)\n        m2 ← Remplacer(c, m, m2)\n        e ← e - 1\n    FinTantque\n    Si m2 = m Alors\n        Ecrire(\"Bravo, vous avez gagné !\")\n    Sinon\n        Ecrire(\"Désolé, vous avez perdu !\")\n    FinSi\n    Ecrire(\"Le mot masqué est \", m)\nFIN", "td": [["T.D.O.G : m", "Chaîne"], ["T.D.O.G : Verif, Saisir, Masquer, Remplacer", "Fonction"], ["T.D.O.G : Jeu", "Procédure"], ["T.D.O.L Jeu : m2 / e / c", "Chaîne / Entier / Caractère"], ["T.D.O.L Remplacer : ch3 / i", "Chaîne / Entier"]], "py": "import os\n\ndef verif(ch):\n    i = 0\n    while i < len(ch) and \"A\" <= ch[i].upper() <= \"Z\":\n        i = i + 1\n    return i == len(ch) and 5 <= len(ch) <= 20\n\ndef saisir():\n    ch = input(\"Taper le mot à deviner : \")\n    while not verif(ch):\n        ch = input(\"Taper le mot à deviner : \")\n    return ch\n\ndef masquer(x):\n    ch = x[0]\n    for i in range(1, len(x) - 1):\n        ch = ch + \"-\"\n    return ch + x[len(x) - 1]\n\ndef remplacer(c, ch1, ch2):\n    ch3 = \"\"\n    for i in range(len(ch1)):\n        if ch1[i].upper() == c.upper():\n            ch3 = ch3 + ch1[i]\n        else:\n            ch3 = ch3 + ch2[i]\n    return ch3\n\ndef jeu(m):\n    m2 = masquer(m)\n    e = len(m)\n    while m2 != m and e > 0:\n        print(\"Le mot à deviner est\", m2)\n        print(\"Il vous reste\", e, \"essai(s)\")\n        c = input(\"Proposer un caractère : \")\n        m2 = remplacer(c, m, m2)\n        e = e - 1\n    if m2 == m:\n        print(\"Bravo, vous avez gagné !\")\n    else:\n        print(\"Désolé, vous avez perdu !\")\n    print(\"Le mot masqué est\", m)\n\n# programme principal\nm = saisir()\nos.system(\"cls\")\njeu(m)", "his": ["sujet-7.py"], "notes": ["La logique est juste : masque, remplacement sans tenir compte de la casse, nombre d'essais égal à la longueur du mot.", "<b>Messages :<\/b> recopie-les exactement : « Le mot à deviner est », « Il vous reste … essai(s) », « Proposer un caractère : », « Bravo, vous avez gagné ! », « Désolé, vous avez perdu ! ». L'exemple affiche aussi « Le mot masqué est Dresser » à la fin.", "Dans <code>verif<\/code>, <code>ch[i].upper()[0]<\/code> : le <code>[0]<\/code> ne sert à rien, <code>ch[i].upper()<\/code> est déjà un seul caractère.", "<code>os.system(\"cls\")<\/code> correspond à <code>Effacer_Ecran()<\/code> : n'oublie pas <code>import os<\/code> en première ligne."]}, {"id": "sj8", "group": "sujets", "label": "Sujet 8", "title": "Entiers égaux à la somme des puissances k de leurs chiffres", "enonce": "Afficher tous les entiers n de quatre chiffres tels que n = somme des puissances k<sup>ième<\/sup> de ses chiffres, avec 1 ≤ k ≤ 5. Pour chaque n, on essaie k = 1, 2, 3… et on s'arrête dès que l'égalité est vraie.<br><b>Exemple :<\/b> 1634 = 1⁴ + 6⁴ + 3⁴ + 4⁴ : on affiche n=1634 et k=4. 2114 ne vérifie la propriété pour aucun k.", "algo": "ALGORITHME Puissances\nDEBUT\n    Pour n de 1000 à 9999 Faire\n        k ← 1\n        Tantque (k ≤ 5) et (SomPuiss(n, k) ≠ n) Faire\n            k ← k + 1\n        FinTantque\n        Si k ≤ 5 Alors\n            Ecrire(\"n=\", n, \" et k=\", k)\n        FinSi\n    FinPour\nFIN\n\nFONCTION Puissance (a, b : Entier) : Entier\nDEBUT\n    p ← 1\n    Pour i de 1 à b Faire\n        p ← p * a\n    FinPour\n    Retourner p\nFIN\n\nFONCTION SomPuiss (n, k : Entier) : Entier\nDEBUT\n    s ← 0\n    Tantque n ≠ 0 Faire\n        s ← s + Puissance(n mod 10, k)\n        n ← n div 10\n    FinTantque\n    Retourner s\nFIN", "td": [["T.D.O.G : n, k", "Entier"], ["T.D.O.G : Puissance, SomPuiss", "Fonction"], ["T.D.O.L Puissance : p, i", "Entier"], ["T.D.O.L SomPuiss : s", "Entier"]], "py": "def puissance(a, b):\n    p = 1\n    for i in range(1, b + 1):\n        p = p * a\n    return p\n\ndef som_puiss(n, k):\n    s = 0\n    while n != 0:\n        s = s + puissance(n % 10, k)\n        n = n // 10\n    return s\n\n# programme principal\nfor n in range(1000, 10000):\n    k = 1\n    while k <= 5 and som_puiss(n, k) != n:\n        k = k + 1\n    if k <= 5:\n        print(\"n=\" + str(n), \"et k=\" + str(k))", "notes": ["Puissance est le module M2 de ton cours ; SomPuiss reprend la boucle « somme des chiffres » (M E) en élevant chaque chiffre à la puissance k.", "Dans SomPuiss, n est un paramètre <b>par valeur<\/b> : le modifier ne change pas le n de la boucle Pour du programme principal.", "Le programme trouve 1634, 8208, 9474 (k = 4) et 4150, 4151 (k = 5)."], "his": []}, {"id": "sj9", "group": "sujets", "label": "Sujet 9", "title": "Entiers homogènes", "enonce": "N et M sont <b>homogènes<\/b> s'ils ont les mêmes facteurs premiers. Saisir N et M (5 &lt; N &lt; M) et dire s'ils sont homogènes.<br><b>Exemples :<\/b> 60 = 2²·3·5 et 90 = 2·3²·5 sont homogènes (facteurs 2, 3, 5) · 60 et 420 = 2²·3·5·7 ne le sont pas.", "algo": "ALGORITHME Homogenes\nDEBUT\n    n ← Saisir(5, \"N = \")\n    m ← Saisir(n, \"M = \")\n    Si Fact(n) = Fact(m) Alors\n        Ecrire(\"homogènes\")\n    Sinon\n        Ecrire(\"non homogènes\")\n    FinSi\nFIN\n\nFONCTION Saisir (a : Entier ; msg : Chaîne) : Entier\nDEBUT\n    Répéter\n        Ecrire(msg)\n        Lire(x)\n    Jusqu'à x > a\n    Retourner x\nFIN\n\nFONCTION Fact (x : Entier) : Chaîne\nDEBUT\n    ch ← \"\"\n    i ← 2\n    Tantque x ≠ 1 Faire\n        Si x mod i = 0 Alors\n            Tantque x mod i = 0 Faire\n                x ← x div i\n            FinTantque\n            ch ← ch + convch(i) + \"*\"\n        Sinon\n            i ← i + 1\n        FinSi\n    FinTantque\n    Retourner ch\nFIN", "td": [["T.D.O.G : n, m", "Entier"], ["T.D.O.G : Saisir, Fact", "Fonction"], ["T.D.O.L Saisir : x", "Entier"], ["T.D.O.L Fact : ch / i", "Chaîne / Entier"]], "py": "def saisir(a, msg):\n    x = int(input(msg))\n    while not x > a:\n        x = int(input(msg))\n    return x\n\ndef fact(x):\n    ch = \"\"\n    i = 2\n    while x != 1:\n        if x % i == 0:\n            while x % i == 0:\n                x = x // i\n            ch = ch + str(i) + \"*\"\n        else:\n            i = i + 1\n    return ch\n\n# programme principal\nn = saisir(5, \"N = \")\nm = saisir(n, \"M = \")\nif fact(n) == fact(m):\n    print(\"homogènes\")\nelse:\n    print(\"non homogènes\")", "his": ["Sujet-9.py", "sujet-9-M2.py"], "notes": ["Tes deux versions sont <b>justes<\/b>. La version 2 est la meilleure : Fact rend la liste des facteurs <b>distincts<\/b> dans l'ordre croissant (\"2*3*5*\"), il suffit de comparer deux chaînes.", "<code>saisir(a, msg)<\/code> avec un message en paramètre : excellente idée, un seul module sert pour N et pour M.", "Version 1 (tableaux) : <code>array([int] * 100)<\/code> fonctionne, mais écris <code>array([int()] * 100)<\/code> comme dans le cours. Et <code>global j<\/code> pour renvoyer la taille est moins clair qu'un <code>return j<\/code>.", "Le message de l'énoncé est libre ici : « homogènes » / « non homogènes » suffit."]}, {"id": "sj10", "group": "sujets", "label": "Sujet 10", "title": "Les entiers manquants", "enonce": "Saisir N (2 ≤ N ≤ 10), remplir T par N entiers positifs triés dans l'ordre croissant, puis afficher les entiers manquants entre le premier et le dernier élément, ainsi que leur nombre.<br><b>Exemple :<\/b> T = 5, 6, 10, 11, 13, 14, 15, 19 : « Les entiers manquants sont : 7 8 9 12 16 17 18 ; leur nombre est 7 ».", "algo": "ALGORITHME Manquants\nDEBUT\n    n ← Saisir()\n    Remplir(T, n)\n    Manquants(T, n)\nFIN\n\nFONCTION Saisir () : Entier\nDEBUT\n    Répéter\n        Ecrire(\"N = \")\n        Lire(n)\n    Jusqu'à (2 ≤ n) et (n ≤ 10)\n    Retourner n\nFIN\n\nPROCEDURE Remplir (@T : Tab ; n : Entier)\nDEBUT\n    Répéter\n        Ecrire(\"T[0] = \")\n        Lire(T[0])\n    Jusqu'à T[0] ≥ 0\n    Pour i de 1 à n - 1 Faire\n        Répéter\n            Ecrire(\"T[\", i, \"] = \")\n            Lire(T[i])\n        Jusqu'à T[i] ≥ T[i - 1]\n    FinPour\nFIN\n\nPROCEDURE Manquants (T : Tab ; n : Entier)\nDEBUT\n    ch ← \"\"\n    nb ← 0\n    Pour i de 0 à n - 2 Faire\n        Pour j de T[i] + 1 à T[i + 1] - 1 Faire\n            ch ← ch + convch(j) + \" \"\n            nb ← nb + 1\n        FinPour\n    FinPour\n    Ecrire(\"Les entiers manquants sont : \", ch, \"; leur nombre est \", nb, \".\")\nFIN", "td": [["T.D.N.T", "Tab = Tableau de 10 Entier"], ["T.D.O.G : n", "Entier"], ["T.D.O.G : T", "Tab"], ["T.D.O.L Manquants : ch / nb, i, j", "Chaîne / Entier"]], "py": "from numpy import array\n\ndef saisir():\n    n = int(input(\"N = \"))\n    while not 2 <= n <= 10:\n        n = int(input(\"N = \"))\n    return n\n\ndef remplir(t, n):\n    t[0] = int(input(\"T[0] = \"))\n    while t[0] < 0:\n        t[0] = int(input(\"T[0] = \"))\n    for i in range(1, n):\n        t[i] = int(input(\"T[\" + str(i) + \"] = \"))\n        while t[i] < t[i - 1]:\n            t[i] = int(input(\"T[\" + str(i) + \"] = \"))\n\ndef manquants(t, n):\n    ch = \"\"\n    nb = 0\n    for i in range(n - 1):\n        for j in range(t[i] + 1, t[i + 1]):\n            ch = ch + str(j) + \" \"\n            nb = nb + 1\n    print(\"Les entiers manquants sont :\", ch + \"; leur nombre est\", str(nb) + \".\")\n\n# programme principal\nn = saisir()\nt = array([int()] * n)\nremplir(t, n)\nmanquants(t, n)", "his": ["sujet-10.py", "Sujet-10-M2.py"], "notes": ["Tes deux versions sont <b>justes<\/b>. La version 2 est la meilleure : comme T est trié, les manquants sont simplement les entiers entre deux cases voisines, sans recherche.", "La version 1 appelle <code>exist<\/code> pour chaque entier de l'intervalle : c'est une recherche séquentielle à chaque fois, beaucoup plus lent.", "<b>Message :<\/b> écris « Les entiers manquants sont : … ; leur nombre est 7. » comme l'énoncé, pas « les ent manq sont … leur nbr ».", "<code>array([int] * n)<\/code> : écris plutôt <code>array([int()] * n)<\/code>, comme dans le cours."]}, {"id": "sj11", "group": "sujets", "label": "Sujet 11", "title": "La suite de Frank équilibrée", "enonce": "U₁ = x et U<sub>n<\/sub> = U<sub>n-1<\/sub> + PGCD(n, U<sub>n-1<\/sub>) pour n ≥ 2. On définit V<sub>n<\/sub> = U<sub>n<\/sub> − U<sub>n-1<\/sub> : chaque terme vaut 1 ou un nombre premier. V est <b>équilibrée<\/b> quand le nombre de 1 est égal au nombre de premiers. Saisir x (2 ≤ x ≤ 10) et afficher après combien de termes V devient équilibrée, ou « Impossible d'atteindre l'équilibre après le calcul de 30 termes ». On ne vérifie pas que les termes différents de 1 sont premiers.<br><b>Exemples :<\/b> x = 4 : 2, 3, 1, 5, 3, 1, 1, 1, équilibrée après 8 termes · x = 7 : impossible après 30 termes.", "algo": "ALGORITHME Suite_Frank\nDEBUT\n    x ← Saisir()\n    u ← x\n    nb1 ← 0\n    nbp ← 0\n    n ← 2\n    Répéter\n        v ← Pgcd(n, u)\n        u ← u + v\n        Si v = 1 Alors\n            nb1 ← nb1 + 1\n        Sinon\n            nbp ← nbp + 1\n        FinSi\n        n ← n + 1\n    Jusqu'à (nb1 = nbp) ou (n = 32)\n    Si nb1 = nbp Alors\n        Ecrire(\"La suite V est équilibrée après le calcul de \", n - 2, \" termes\")\n    Sinon\n        Ecrire(\"Impossible d'atteindre l'équilibre après le calcul de 30 termes\")\n    FinSi\nFIN\n\nFONCTION Saisir () : Entier\nDEBUT\n    Répéter\n        Ecrire(\"x = \")\n        Lire(x)\n    Jusqu'à (2 ≤ x) et (x ≤ 10)\n    Retourner x\nFIN\n\nFONCTION Pgcd (a, b : Entier) : Entier\nDEBUT\n    Tantque b ≠ 0 Faire\n        r ← a mod b\n        a ← b\n        b ← r\n    FinTantque\n    Retourner a\nFIN", "td": [["T.D.O.G : x, u, v, n, nb1, nbp", "Entier"], ["T.D.O.G : Saisir, Pgcd", "Fonction"], ["T.D.O.L Pgcd : r", "Entier"]], "py": "def saisir():\n    x = int(input(\"x = \"))\n    while not 2 <= x <= 10:\n        x = int(input(\"x = \"))\n    return x\n\ndef pgcd(a, b):\n    while b != 0:\n        r = a % b\n        a = b\n        b = r\n    return a\n\n# programme principal\nx = saisir()\nu = x\nnb1 = 0\nnbp = 0\nn = 2\nfini = False\nwhile fini == False:\n    v = pgcd(n, u)\n    u = u + v\n    if v == 1:\n        nb1 = nb1 + 1\n    else:\n        nbp = nbp + 1\n    n = n + 1\n    fini = (nb1 == nbp) or (n == 32)\nif nb1 == nbp:\n    print(\"La suite V est équilibrée après le calcul de\", n - 2, \"termes\")\nelse:\n    print(\"Impossible d'atteindre l'équilibre après le calcul de 30 termes\")", "notes": ["Pas besoin de stocker U et V : <b>V<sub>n<\/sub> = PGCD(n, U<sub>n-1<\/sub>)<\/b>, il suffit de garder le dernier U.", "Les termes vont de V₂ à V₃₁ : quand n atteint 32, on en a calculé 30. Le nombre de termes calculés est donc n − 2.", "Le N.B. de l'énoncé dit de ne pas tester la primalité : tout terme différent de 1 compte comme premier.", "Pgcd est le module C de la fiche arithmétique : à savoir par cœur."], "his": []}, {"id": "sj12", "group": "sujets", "label": "Sujet 12", "title": "La collection d'images", "enonce": "Un client ouvre 50 paquets de biscuits ; chacun contient l'image d'un personnage, et la collection compte 20 personnages distincts. On donne l'algorithme du programme principal : il lit le nom du personnage de chaque paquet (Répéter… Jusqu'à Valide), le range dans P s'il n'y est pas encore (Chercher), compte les personnages distincts dans C et affiche « Vous avez gagné » si C = 20, « Vous avez perdu » sinon.<br><b>Travail :<\/b> écrire les modules Valide et Chercher, les tableaux de déclaration, et traduire en Python.", "algo": "ALGORITHME Collection\nDEBUT\n    Répéter\n        Ecrire(\"Donner le nom du personnage trouvé dans le paquet n° 1 : \")\n        Lire(P[0])\n    Jusqu'à Valide(P[0])\n    C ← 1\n    Pour i de 2 à 50 Faire\n        Répéter\n            Ecrire(\"Donner le nom du personnage trouvé dans le paquet n° \", i, \" : \")\n            Lire(Pers)\n        Jusqu'à Valide(Pers)\n        Si Chercher(Pers, P, C) = Faux Alors\n            P[C] ← Pers\n            C ← C + 1\n        FinSi\n    FinPour\n    Si C = 20 Alors\n        Ecrire(\"Vous avez gagné\")\n    Sinon\n        Ecrire(\"Vous avez perdu\")\n    FinSi\nFIN\n\nFONCTION Valide (x : Chaîne) : Booléen\nDEBUT\n    i ← 0\n    Tantque (i < long(x)) et ((\"A\" ≤ majus(x[i]) ≤ \"Z\") ou (x[i] = \" \")) Faire\n        i ← i + 1\n    FinTantque\n    Retourner (i = long(x)) et (x ≠ \"\")\nFIN\n\nFONCTION Chercher (x : Chaîne ; P : Tab ; C : Entier) : Booléen\nDEBUT\n    i ← 0\n    Tantque (i < C) et (P[i] ≠ x) Faire\n        i ← i + 1\n    FinTantque\n    Retourner i < C\nFIN", "td": [["T.D.N.T", "Tab = Tableau de 20 Chaîne"], ["T.D.O.G : P", "Tab"], ["T.D.O.G : Pers", "Chaîne"], ["T.D.O.G : C, i", "Entier"], ["T.D.O.G : Valide, Chercher", "Fonction"], ["T.D.O.L Valide, Chercher : i", "Entier"]], "py": "from numpy import array\n\ndef valide(x):\n    i = 0\n    while i < len(x) and (\"A\" <= x[i].upper() <= \"Z\" or x[i] == \" \"):\n        i = i + 1\n    return i == len(x) and x != \"\"\n\ndef chercher(x, p, c):\n    i = 0\n    while i < c and p[i] != x:\n        i = i + 1\n    return i < c\n\n# programme principal\np = array([str] * 20)\np[0] = input(\"Donner le nom du personnage trouvé dans le paquet n° 1 : \")\nwhile not valide(p[0]):\n    p[0] = input(\"Donner le nom du personnage trouvé dans le paquet n° 1 : \")\nc = 1\nfor i in range(2, 51):\n    pers = input(\"Donner le nom du personnage trouvé dans le paquet n° \" + str(i) + \" : \")\n    while not valide(pers):\n        pers = input(\"Donner le nom du personnage trouvé dans le paquet n° \" + str(i) + \" : \")\n    if chercher(pers, p, c) == False:\n        p[c] = pers\n        c = c + 1\nif c == 20:\n    print(\"Vous avez gagné\")\nelse:\n    print(\"Vous avez perdu\")", "notes": ["L'énoncé ne dit pas ce qu'est un nom valide : j'ai choisi « non vide, formé de lettres et d'espaces ». Écris ton choix en commentaire sur ta copie.", "Chercher est la <b>recherche séquentielle<\/b> limitée aux C premières cases : seules celles-là sont remplies.", "Comme il n'existe que 20 personnages distincts, C ne dépasse jamais 20 : un tableau de 20 chaînes suffit."], "his": []}], "his": {"sujet-1__1_.py": "from numpy import array\ndef saisir(msg):\n    ok=False\n    while ok==False:\n        ch=input(msg)\n        test=True\n        for i in range(len(ch)):\n            if not \"A\"<=ch[i]<=\"Z\":\n                test=False\n        ok=test==True and ch!=\"\"\n    return ch\n\ndef saisir2():\n    global n\n    n=int(input(\"N = \"))\n    while not 2<=n<=20:\n        n=int(input(\"N = \"))\n        \ndef remplir(n,ch,t):\n    for i in range(n):\n        ok=False\n        while ok==False:\n            t[i]=saisir(\"case \"+str(i)+\" : \")\n            ok=len(ch)==len(t[i]) \n        \ndef affiche(n,t,ch):\n    for i in range(n):\n        nb=0\n        for j in range(len(ch)):\n            if ch[j]==t[i][j]:\n                nb=nb+1\n        dr=nb/len(ch)*100\n        print(dr)\n    \n    \n    \n#PP\nc=saisir(\"Taper une chaîne \")\nsaisir2()\nt=array([str]*n)\nremplir(n,c,t)\naffiche(n,t,c)", "controle__1_.py": "def dr(x,y):\n    nb=0\n    for i in range(len(x)):\n        if x[i]==y[i]:\n            nb=nb+1\n    return nb/len(x)*100\n\ndef maj(x):\n    i=0\n    while i<len(x) and \"A\"<=x[i]<=\"Z\":\n        i=i+1\n    return i==len(x) and x!=\"\"", "sujetM2__1_.py": "from numpy import array\nfrom controle import dr,maj\ndef saisir():\n    global n,t,ch\n    ch=input(\"Taper une chaîne \")\n    while not maj(ch):\n        ch=input(\"retaper ...\")\n    n=int(input(\"N = \"))\n    while not 2<=n<=20:\n        n=int(input(\"N = \"))\n    t=array([str]*n)\n    for i in range(n):\n        t[i]=input(\"case \"+str(i)+\" : \")\n        while not(maj(t[i]) and len(ch)==len(t[i])):\n            t[i]=input(\"case \"+str(i)+\" : \")\n\n#PP\nsaisir()\nfor i in range(n):\n    print(dr(ch,t[i]))", "Sujet-2.py": "from numpy import array\n\ndef saisir():\n    n=int(input(\"N= \"))\n    while not 5<=n<=20:\n        n=int(input(\"N=\"))\n    return n\ndef valide(x):\n    s=0\n    for i in range(len(x)):\n        if \"A\"<=x[i]<=\"Z\" or x[i]==\" \":\n            s=s+1\n    return s==len(x) and x!=\"\" and len(x)<=20\ndef remplir(n,t):\n    for i in range(n):\n        t[i]=input(\"case\"+str(i))\n        while not valide(t[i]):\n            t[i]=input(\"case\"+str(i))\ndef voy(x):\n    c=0\n    for i in range(len(x)):\n        if \"OUAYIE\".find(x[i])!=-1:\n            c=c+1\n    return c\ndef maxi(n,t):\n    m=voy(t[0])\n    for i in range(1,n):\n        if voy(t[i])>m:\n            m=voy(t[i])\n    return m\n\n\n    \n    \n#PP\nn=saisir()\nt=array([str]*n)\nremplir(n,t)\nfor i in range(n):\n    if voy(t[i])==maxi(n,t):\n        print(t[i])", "Sujet-3.py": "def saisir():\n    global n,m\n    n,m=int(input(\"N= \")),int(input(\"m= \"))\n    while not (n>=100 and n<m):\n        n,m=int(input(\"N= \")),int(input(\"m= \"))\ndef harch(x):\n    ch=str(x)\n    s=0\n    for i in range(len(ch)):\n        s=s+int(ch[i])\n    return x%s==0\ndef prem(x):\n    nb=0\n    for i in range(1,x+1):\n        if x%i==0:\n            nb=nb+1\n    return nb==2\n#pp\nsaisir()\nfor i in range(n,m+1):\n    if harch(i) and prem(i-1):\n        print(i,\"car\",i,\"est harchad et son prédécesseur\",i-1,\"est premier\")", "Sujet-4.py": "def verif(x):\n    test=True\n    i=0\n    while i<len(x) and test:\n        test=\"A\"<=x[i]<=\"Z\"\n \n            t[i]=int(input(\"T[\"+str(i)+\"]=\"))\n\n        \ndef exist (n,t,x):\n    u=False\n    for i in range (n):\n        if x==t[i]:\n            u=True\n    return u    \ndef manq (n,t):\n    global ch,nb\n    ch=\"\"\n    nb=0\n    for i in range (t[0],t[n-1]):\n        if not exist (n,t,i):\n            ch=ch+str(i)+\" \"\n            nb=nb+1\n#PP\nn=saisir()\nt=numpy.array([int]*n)\nremplir(n,t)\nmanq(n,t)\nprint (\"les ent manq sont\",ch,\"leur nbr \",nb)", "Sujet-10-M2.py": "import numpy\ndef saisir():\n    n=int(input(\"N = \"))\n    while not 2<=n<=10:\n        n=int(input(\"N = \"))\n    return n\n\ndef remplir(n,t):\n    x=0\n    for i in range(n):\n        t[i]=int(input(\"T[\"+str(i)+\"]=\"))\n        while t[i]<x:\n            t[i]=int(input(\"T[\"+str(i)+\"]=\"))\n        x=t[i]\n\ndef manq (n,t):\n    c=0\n    print(\"les ent manq sont \",end=\" \")\n    for i in range (n-1):\n        for j in range (t[i]+1,t[i+1]):\n            print (j,end=\" \")\n            c=c+1\n    print (\"leur nbr est \",c)\n\"\"\"manq(5,[10,14,15,20,22])\"\"\"\n        \n\n#PP\nn=saisir()\nt=numpy.array([int]*n)\nremplir(n,t)\nmanq(n,t)"}};

/* ---------------- theme */
let THEME = "dark";
try { THEME = localStorage.getItem(KEY+"-theme") || "dark"; } catch(e) {}
const MQ = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
function applyMode(){ const dark = THEME==="dark" || (THEME==="auto" && MQ && MQ.matches); document.documentElement.setAttribute("data-mode", dark?"dark":"light"); }
function setTheme(th){
  THEME = th;
  if (th==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", th);
  applyMode();
  try { localStorage.setItem(KEY+"-theme", th); } catch(e) {}
}
setTheme(THEME);

/* ---------------- helpers */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const strip = h => h.replace(/<[^>]+>/g,"").replace(/&nbsp;/g," ").trim();

const ALGO_KW = "FONCTION|PROCEDURE|ALGORITHME|DEBUT|FIN|Si|Alors|Sinon|FinSi|Pour|de|à|Faire|FinPour|Tantque|FinTantque|Répéter|Retourner|Pas";
const ALGO_FN = "Ecrire|Lire|long|pos|sous_chaîne|effacer|majus|convch|valeur|estnum|ord|chr|abs|ent|arrondi|racinecarré|aléa";
const ALGO_OP = "et|ou|non|div|mod";
const PY_KW = "def|return|for|in|while|if|elif|else|and|or|not|global|from|import";
const PY_FN = "range|len|int|str|input|print|float|array|upper|find|isnumeric|isdecimal";
const CST = {algo:"Vrai|Faux", py:"True|False|None"};
function wre(p){ return new RegExp("(?<![\\wÀ-ÿ])(" + p + ")(?![\\wÀ-ÿ])","g"); }
function hlPlain(s, lang){
  s = esc(s);
  const R = lang==="algo" ? [[ALGO_KW,"kw"],[ALGO_FN,"fn"],[ALGO_OP,"op"],[CST.algo,"cst"]] : [[PY_KW,"kw"],[PY_FN,"fn"],[CST.py,"cst"]];
  if (lang==="algo") s = s.replace(/Jusqu'à/g, "\u0001kw\u0002Jusqu'à\u0003");
  for (const [p,c] of R) s = s.replace(wre(p), (m)=>"\u0001"+c+"\u0002"+m+"\u0003");
  s = s.replace(/(?<![\w\u0001\u0002])(\d+)(?!\w)/g, m=>"\u0001num\u0002"+m+"\u0003");
  if (lang==="algo") s = s.replace(/←/g,"\u0001arr\u0002←\u0003");
  return s.replace(/\u0001/g,'<span class="').replace(/\u0002/g,'">').replace(/\u0003/g,"</span>");
}
function hl(line, lang){
  let com = "";
  const m = line.match(/#.*$/);
  if (m){ const before = line.slice(0, m.index); if ((before.match(/"/g)||[]).length % 2 === 0){ com = '<span class="com">'+esc(m[0])+'</span>'; line = before; } }
  return line.split(/("[^"]*")/).map(p => (p.length>1 && p[0]==='"' && p.at(-1)==='"') ? '<span class="str">'+esc(p)+'</span>' : hlPlain(p, lang)).join("") + com;
}
function pre(src, lang){
  return "<pre>" + src.split("\n").map((l,i)=>'<span class="ln">'+(i+1)+'</span>'+(hl(l,lang)||" ")).join("\n") + "</pre>";
}
function face(lang, src, cons, label){
  const lab = label || (lang==="algo" ? "ALGORITHME" : "PYTHON");
  const c = cons ? '<div class="cons">'+esc(cons)+'</div>' : "";
  return '<div class="face '+lang+'"><div class="lab">'+lab+'</div>'+pre(src,lang)+c+'</div>';
}

/* ---------------- progress */
function exIds(ch){ const ids=[]; ch.fill.forEach((_,i)=>ids.push(ch.id+"-f"+i)); ch.trace.forEach((_,i)=>ids.push(ch.id+"-t"+i)); ch.parsons.forEach((_,i)=>ids.push(ch.id+"-p"+i)); return ids; }
function chProgress(ch){
  const q = (S.quiz[ch.id]||0) / ch.quiz.length;
  const ids = exIds(ch); const e = ids.filter(i=>S.ex[i]).length / ids.length;
  return Math.round((q*0.5 + e*0.5)*100);
}
function gProgress(g){ return Math.round(100 * g.items.filter(e=>S.exo[e.id]==="ok").length / g.items.length); }
function levels(){ return DATA.map((c,i)=>({id:c.id, n:i+1, short:c.short, title:c.title, goal:c.goal, p:chProgress(c), kind:"ch", ref:c}))
  .concat(GROUPS.map((g,j)=>({id:g.id, n:7+j, short:SHORTG[g.id], title:g.title, goal:g.goal, p:gProgress(g), kind:"gr", ref:g}))); }
function overall(){ const L=levels(); return Math.round(L.reduce((a,l)=>a+l.p,0)/L.length); }

/* ---------------- rail */
function rail(active){
  const L = levels();
  const link = l => `<a href="#${l.id}" class="${active===l.id?"on":""}" style="--c:${COLORS[l.n-1]}"><span class="hx">${l.n}</span><span class="t"><small>${RANKS[l.n-1]}</small>${l.short}</span><span class="bar"><i style="width:${l.p}%"></i></span></a>`;
  $("#rail").innerHTML = `
  <a class="brand" href="#accueil"><span class="mark">DC</span><span><b>Devoir de contrôle</b><span>Informatique · 4<sup>e</sup> Sc. exp.</span></span></a>
  <nav class="nav"><span class="lab">Le cours · 6 chapitres</span>${L.slice(0,6).map(link).join("")}
    <span class="lab">Séries et sujets du prof</span>${L.slice(6).map(link).join("")}
    <span class="lab">S'entraîner</span>
    <a href="#flashcards" class="${active==="flashcards"?"on":""}" style="--c:var(--c1)"><span class="hx">⇄</span><span class="t">Flashcards</span></a>
    <a href="#devoir" class="${active==="devoir"?"on":""}" style="--c:var(--cx)"><span class="hx">20</span><span class="t">Devoir blanc</span></a>
  </nav>
  <div class="foot"><div class="seg theme" role="group" aria-label="Thème"><button data-th="light">Clair</button><button data-th="auto">Auto</button><button data-th="dark">Sombre</button></div><span>Ta progression et tes réponses restent dans ce navigateur.</span><button class="linkbtn" id="reset">Effacer ma progression</button></div>`;
  document.querySelectorAll("[data-th]").forEach(x=>{ x.classList.toggle("on", x.dataset.th===THEME); x.onclick=()=>{ setTheme(x.dataset.th); const y=window.scrollY; route(); window.scrollTo(0,y); }; });
  $("#reset").onclick = () => { const b=$("#reset"); if (b.dataset.sure){ S={quiz:{},ex:{},dv:[],exo:{},ans:{}}; save(); route(); } else { b.dataset.sure=1; b.textContent="Clique encore pour confirmer"; } };
}

}

/* ---------------- home */
function home(){
  document.documentElement.style.setProperty("--c","var(--c1)");
  const L = levels();

function firstUnfinished(){ const l = levels().find(l=>l.p<100); return l ? l.id : "devoir"; }

/* ---------------- one question */
function renderQ(el, q, num, onAnswer){
  const order = shuffle(q.o.map((t,i)=>i));
  el.innerHTML = `<div class="qt">${num!=null?'<span class="qn">'+num+'</span>':""}<span>${q.q}</span></div>
    <div class="opts">${order.map(i=>`<button class="opt" data-i="${i}">${esc(q.o[i])}</button>`).join("")}</div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i = +b.dataset.i, ok = i===q.a;
    el.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(+x.dataset.i===q.a) x.classList.add("right"); });
    if(!ok) b.classList.add("wrong");
    const w = document.createElement("div"); w.className="why";
    w.innerHTML = (ok?'<b class="v">Juste.</b> ':'<b class="x">Pas tout à fait.</b> ')+q.why; el.appendChild(w);
    onAnswer && onAnswer(ok);
  });
}

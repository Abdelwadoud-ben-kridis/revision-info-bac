function segs(){ document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.v===VIEW)); }
function applyView(){ document.querySelectorAll("#pane .pair").forEach(p=>{ p.classList.toggle("only-algo",VIEW==="algo"); p.classList.toggle("only-py",VIEW==="py"); }); }

function pane(ch){
  const P = $("#pane");
  if (TAB==="cours"){
    P.innerHTML = ch.lesson.map(b=>{
      if (b.t==="table") return `<div class="block">${b.title?`<div class="sec"><h3>${b.title}</h3></div>`:""}<div class="tblwrap"><table class="tbl ${b.cls||""}"><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr>${b.rows.map(r=>"<tr>"+r.map(c=>`<td>${b.cls?c.replace(/(.*?)(<small>.*<\/small>)?$/, (m,a,s)=>esc(a)+(s||"")):c}</td>`).join("")+"</tr>").join("")}</table></div></div>`;
      if (b.t==="boxes") return `<div class="block boxes">${b.items.map(x=>`<div class="box ${x.k}"><div class="bt">${{coeur:"Par cœur",piege:"Piège",astuce:"Astuce",cours:"Dans ton cours"}[x.k]} · ${x.title}</div>${x.html}</div>`).join("")}</div>`;
      if (b.t==="pair") return `<div class="block"><div class="sec"><h3>${b.title}</h3><span>${b.sub||""}</span></div><div class="pair">${face("algo",b.algo)}${face("py",b.py,b.cons)}</div></div>`;
      if (b.t==="mod"){
        const td = b.td ? `<table class="tdol"><caption>T.D.O.L</caption><tr><th>Objet</th><th>Type</th></tr>${b.td.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table>` : "";
        return `<div class="mod"><div class="mh"><span class="tagn">${b.num}</span><h3>${b.title}</h3><span class="kind">${b.kind}</span></div>${b.note?`<div class="note">${b.note}</div>`:""}<div class="pair">${face("algo",b.algo)}${face("py",b.py,b.cons)}</div>${td}</div>`;
      }
      return "";
    }).join("");
    applyView();
  } else if (TAB==="quiz"){
    quiz(ch, P);
  } else {
    exercises(ch, P);
  }
}

function quiz(ch, P){
  let score=0, answered=0; const n=ch.quiz.length;
  P.innerHTML = `<div class="qhead"><div><div class="score" id="sc">0 / ${n}</div><div class="muted" style="font-size:14px">Meilleur score : ${S.quiz[ch.id]||0} / ${n}</div></div><button class="btn small ghost" id="again">Mélanger et recommencer</button></div><div id="qs"></div>`;
  const qs = $("#qs");
  shuffle(ch.quiz).forEach((q,i)=>{
    const d=document.createElement("div"); d.className="q"; qs.appendChild(d);
    renderQ(d, q, i+1, ok=>{
      answered++; if(ok) score++;
      $("#sc").textContent = score+" / "+n;
      if (answered===n){
        if (score > (S.quiz[ch.id]||0)){ S.quiz[ch.id]=score; save(); rail(ch.id); }
        const f=document.createElement("div"); f.className="card"; f.style.marginTop="8px";
        f.innerHTML = `<b style="font-size:18px">${score} / ${n}</b> · ${score===n?"Parfait. Passe aux exercices.":score>=n*0.7?"Bien. Relis les explications de tes erreurs, puis recommence.":"Relis le cours de ce chapitre, puis recommence."}`;
        qs.appendChild(f);
      }
    });
  });
  $("#again").onclick=()=>quiz(ch,P);
}

/* ---------------- exercises */
const SYM = {"<-":"←","<>":"≠","!=":"≠",">=":"≥","<=":"≤"};
function norm(s, lang){
  s = s.trim().replace(/\s+/g," ");
  if (lang==="algo"){ for (const k in SYM) if (s===k) s=SYM[k]; s = s.toLowerCase(); }
  return s;
}
function mark(id){ if(!S.ex[id]){ S.ex[id]=1; save(); const a=location.hash.slice(1); rail(a); } }

function exercises(ch, P){
  let h = "";
  if (ch.fill.length) h += `<div class="subh">Complète le code <span class="cnt">écris dans les cases, puis vérifie</span></div>` + ch.fill.map((f,i)=>exFill(ch,f,i)).join("");
  if (ch.trace.length) h += `<div class="subh">Exécute à la main <span class="cnt">ce que tu ferais sur la copie</span></div>` + ch.trace.map((t,i)=>exTrace(ch,t,i)).join("");
  if (ch.parsons.length) h += `<div class="subh">Remets dans l'ordre <span class="cnt">clique sur les lignes dans le bon ordre</span></div>` + ch.parsons.map((p,i)=>`<div class="ex" id="${ch.id}-p${i}"></div>`).join("");
  P.innerHTML = h;
  ch.fill.forEach((f,i)=>wireFill(ch,f,i));
  ch.trace.forEach((t,i)=>wireTrace(ch,t,i));
  ch.parsons.forEach((p,i)=>parsons(ch,p,i));
}
function exFill(ch,f,i){
  const id = ch.id+"-f"+i; let k=0;
  const lines = f.src.split("\n").map((line,li)=>{
    const parts = line.split(/\[\[(.*?)\]\]/);
    let out = '<span class="ln">'+(li+1)+'</span>';
    parts.forEach((p,j)=>{
      if (j%2===0) out += hl(p, f.lang);
      else { const ans=p.split("|"); out += `<input class="blank" data-k="${k++}" data-a="${esc(JSON.stringify(ans)).replace(/"/g,"&quot;")}" size="${Math.max(ans[0].length,2)}" aria-label="case ${k}" autocomplete="off" spellcheck="false">`; }
    });
    return out;
  }).join("\n");
  const sym = f.lang==="algo" ? `<span class="symkeys">${["←","≠","≤","≥"].map(s=>`<button data-s="${s}" aria-label="insérer ${s}">${s}</button>`).join("")}</span>` : "";
  return `<div class="ex" id="${id}"><div class="et"><h4>${f.title}</h4>${S.ex[id]?'<span class="done-pill">Réussi</span>':""}</div>
    <div class="face ${f.lang}"><div class="lab">${f.lang==="algo"?"ALGORITHME":"PYTHON"}</div><pre>${lines}</pre></div>
    <div class="exbar"><button class="btn small" data-act="check">Vérifier</button><button class="btn small ghost" data-act="show">Voir la correction</button>${sym}<span class="msg"></span></div></div>`;
}
function wireFill(ch,f,i){
  const id = ch.id+"-f"+i, el = document.getElementById(id); let last=null;
  el.querySelectorAll(".blank").forEach(b=>{ b.onfocus=()=>last=b; b.oninput=()=>{ b.classList.remove("ok","no"); b.size=Math.max(b.value.length,JSON.parse(b.dataset.a)[0].length,2); }; b.onkeydown=e=>{ if(e.key==="Enter") el.querySelector('[data-act="check"]').click(); }; });
  el.querySelectorAll(".symkeys button").forEach(s=>s.onclick=()=>{ const b=last||el.querySelector(".blank"); b.value+=s.dataset.s; b.focus(); b.oninput(); });
  el.querySelector('[data-act="check"]').onclick=()=>{
    let good=0; const all=el.querySelectorAll(".blank");
    all.forEach(b=>{ const ok = JSON.parse(b.dataset.a).some(a=>norm(a,f.lang)===norm(b.value,f.lang)); b.classList.toggle("ok",ok); b.classList.toggle("no",!ok); if(ok) good++; });
    const m=el.querySelector(".msg");
    if (good===all.length){ m.innerHTML='<span class="good">Tout est juste.</span>'; mark(id); }
    else m.innerHTML=`<span class="bad">${all.length-good} case${all.length-good>1?"s":""} à revoir.</span>`;
  };
  el.querySelector('[data-act="show"]').onclick=()=>{ el.querySelectorAll(".blank").forEach(b=>{ b.value=JSON.parse(b.dataset.a)[0]; b.oninput(); }); el.querySelector(".msg").innerHTML='<span class="muted">Correction affichée. Efface et réessaie de mémoire.</span>'; };
}
function exTrace(ch,t,i){
  const id = ch.id+"-t"+i;
  return `<div class="ex" id="${id}"><div class="et"><h4>${t.title}</h4>${S.ex[id]?'<span class="done-pill">Réussi</span>':""}</div>
    ${face(t.lang,t.src,null,t.lang==="algo"?"ALGORITHME":"PYTHON")}
    <div class="exbar"><label for="${id}-in" class="msg">Résultat :</label><input class="tin" id="${id}-in" autocomplete="off" spellcheck="false" placeholder="ce qui s'affiche"><button class="btn small" data-act="check">Vérifier</button><button class="btn small ghost" data-act="show">Solution</button><span class="msg"></span></div>
    <div class="why" hidden>${t.why}</div></div>`;
}
function traceOk(t, v){ const n=s=>s.trim().replace(/\s+/g," ").replace(/^['"]|['"]$/g,"").toLowerCase(); return n(v)===n(t.ans); }
function wireTrace(ch,t,i){
  const id=ch.id+"-t"+i, el=document.getElementById(id), inp=el.querySelector("input"), m=el.querySelectorAll(".msg")[1], w=el.querySelector(".why");
  const check=()=>{ if(traceOk(t,inp.value)){ m.innerHTML='<span class="good">Juste.</span>'; w.hidden=false; mark(id);} else { m.innerHTML='<span class="bad">Non. Refais la trace tour par tour.</span>'; } };
  el.querySelector('[data-act="check"]').onclick=check; inp.onkeydown=e=>{ if(e.key==="Enter") check(); };
  el.querySelector('[data-act="show"]').onclick=()=>{ m.innerHTML=`Réponse : <code>${esc(t.ans)}</code>`; w.hidden=false; };
}
function parsons(ch,p,i){
  const id=ch.id+"-p"+i, el=document.getElementById(id);
  let pool = shuffle(p.lines.map((l,k)=>k)); let ans=[];
  if (pool.every((v,k)=>v===k)) pool.reverse();
  const draw=()=>{
    el.innerHTML = `<div class="et"><h4>${p.title}</h4>${S.ex[id]?'<span class="done-pill">Réussi</span>':""}</div>
    <div class="parsons"><div class="pz"><span class="plab">LIGNES EN VRAC</span>${pool.map(k=>`<button class="pline" data-k="${k}" data-z="pool">${hl(p.lines[k].trim(),p.lang)}</button>`).join("")||'<span class="muted" style="padding:6px;font-size:14px">Plus rien ici.</span>'}</div>
    <div class="pz ans"><span class="plab">TON ${p.lang==="algo"?"ALGORITHME":"PROGRAMME"}</span>${ans.map(k=>`<button class="pline" data-k="${k}" data-z="ans">${hl(p.lines[k],p.lang)}</button>`).join("")}</div></div>
    <div class="exbar"><button class="btn small" data-act="check">Vérifier</button><button class="btn small ghost" data-act="reset">Recommencer</button><span class="msg"></span></div>`;
    el.querySelectorAll(".pline").forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; if(b.dataset.z==="pool"){ pool=pool.filter(x=>x!==k); ans.push(k);} else { ans=ans.filter(x=>x!==k); pool.push(k);} draw(); });
    el.querySelector('[data-act="reset"]').onclick=()=>{ pool=shuffle(p.lines.map((l,k)=>k)); ans=[]; draw(); };
    el.querySelector('[data-act="check"]').onclick=()=>{
      const m=el.querySelector(".msg");
      if (pool.length){ m.innerHTML='<span class="bad">Place toutes les lignes d\'abord.</span>'; return; }
      const firstBad = ans.findIndex((k,j)=>p.lines[k]!==p.lines[j]);
      if (firstBad<0){ m.innerHTML='<span class="good">Bon ordre.</span>'; mark(id); el.querySelector(".et").innerHTML=`<h4>${p.title}</h4><span class="done-pill">Réussi</span>`; }
      else m.innerHTML=`<span class="bad">La ligne ${firstBad+1} n'est pas à sa place.</span>`;
    };
  };
  draw();
}

/* ---------------- flashcards */
function flashcards(){
  document.documentElement.style.setProperty("--c","var(--c1)");
  const t = DATA[0].lesson[0]; const cards=[];
  t.rows.forEach(r=>{ cards.push([strip(r[0]),strip(r[1])]); cards.push([strip(r[2]),strip(r[3])]); });
  let deck = shuffle(cards), i=0, dir="ap", known=0;
  const draw=()=>{
    const [a,p] = deck[i]; const front = dir==="ap"?a:p, back = dir==="ap"?p:a;
    $("#main").innerHTML = `<span class="eyebrow">S'entraîner</span><h1 style="font-size:34px;margin:6px 0 6px">Flashcards du dictionnaire</h1>
    <p class="goal">Lis la carte, donne la traduction à voix haute, puis retourne-la. ${cards.length} cartes, dans les deux sens.</p>
    <div class="flash"><div class="fc" id="fc" tabindex="0" role="button" aria-label="Retourner la carte">
      <div class="side front"><span class="lab">${dir==="ap"?"ALGORITHME":"PYTHON"}</span><span class="big">${esc(front)}</span><span class="muted" style="font-size:13px">clique pour retourner</span></div>
      <div class="side back"><span class="lab">${dir==="ap"?"PYTHON":"ALGORITHME"}</span><span class="big">${esc(back)}</span></div></div></div>
    <div class="fnav"><button class="btn small ghost" id="prev">← Précédente</button><span class="muted" style="font-variant-numeric:tabular-nums">${i+1} / ${deck.length}</span><button class="btn small" id="next">Suivante →</button></div>
    <div class="fnav"><span class="seg"><button data-d="ap" class="${dir==="ap"?"on":""}">Algo → Python</button><button data-d="pa" class="${dir==="pa"?"on":""}">Python → Algo</button></span><button class="btn small ghost" id="mix">Mélanger</button></div>`;
    const fc=$("#fc"); fc.onclick=()=>fc.classList.toggle("flip"); fc.onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); fc.classList.toggle("flip"); } };
    $("#next").onclick=()=>{ i=(i+1)%deck.length; draw(); }; $("#prev").onclick=()=>{ i=(i-1+deck.length)%deck.length; draw(); };
    $("#mix").onclick=()=>{ deck=shuffle(cards); i=0; draw(); };
    document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ dir=b.dataset.d; draw(); });
  };
  draw();
}

/* ---------------- devoir blanc */
let DV=null;
function devoir(){
  document.documentElement.style.setProperty("--c","var(--cx)");
  if (DV && DV.running){ drawDevoir(); return; }
  const hist = S.dv.length ? `<div class="hist">${S.dv.slice(-8).map(d=>`<span>${d.n}/20 <small>${d.d}</small></span>`).join("")}</div>` : '<span class="muted">Pas encore de devoir blanc.</span>';
  $("#main").innerHTML = `<span class="eyebrow">S'entraîner</span><h1 style="font-size:clamp(30px,4vw,44px);margin:6px 0 8px">Devoir blanc</h1>
  <p class="goal">20 questions tirées au hasard dans les six chapitres : 14 questions de cours et 6 exécutions à la main. 30 minutes, une note sur 20, la correction de chaque question à la fin.</p>
  <div class="card" style="display:flex;flex-direction:column;gap:14px;max-width:640px">
    <div><b>Tes dernières notes</b><div style="margin-top:8px">${hist}</div></div>
    <div><button class="btn" id="go">Commencer le devoir</button></div>
  </div>`;
  $("#go").onclick=startDevoir;
}
function startDevoir(){
  const qs=[], tr=[];
  DATA.forEach((c,i)=>{ c.quiz.forEach(q=>qs.push({type:"q",q,ci:i})); c.trace.forEach(t=>tr.push({type:"t",t,ci:i})); });
  const items = shuffle(shuffle(qs).slice(0,14).concat(shuffle(tr).slice(0,6)));
  items.forEach(it=>{ if(it.type==="q") it.order=shuffle(it.q.o.map((_,k)=>k)); it.ans=null; });
  DV={items, end:Date.now()+30*60*1000, running:true};
  drawDevoir();
}
function drawDevoir(){
  const it=DV.items;
  $("#main").innerHTML = `<div class="dvstick"><div><span class="eyebrow">Devoir blanc</span><div class="muted" style="font-size:14px" id="dvc"></div></div><span class="timer" id="tm"></span><button class="btn" id="rendre">Rendre la copie</button></div><div id="dvq"></div>`;
  const box=$("#dvq");
  it.forEach((x,k)=>{
    const d=document.createElement("div"); d.className="q"; d.style.setProperty("--c",COLORS[x.ci]);
    if (x.type==="q"){
      d.innerHTML=`<div class="tagch">Chapitre ${x.ci+1}</div><div class="qt"><span class="qn">${k+1}</span><span>${x.q.q}</span></div><div class="opts">${x.order.map(i=>`<button class="opt ${x.ans===i?"right":""}" data-i="${i}">${esc(x.q.o[i])}</button>`).join("")}</div>`;
      d.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ x.ans=+b.dataset.i; d.querySelectorAll(".opt").forEach(o=>o.classList.toggle("right",o===b)); count(); });
    } else {
      d.innerHTML=`<div class="tagch">Chapitre ${x.ci+1} · exécution</div><div class="qt"><span class="qn">${k+1}</span><span>${x.t.title}</span></div>${face(x.t.lang,x.t.src,null,x.t.lang==="algo"?"ALGORITHME":"PYTHON")}<div class="exbar"><label class="msg" for="dv${k}">Résultat :</label><input class="tin" id="dv${k}" autocomplete="off" spellcheck="false" value="${x.ans?esc(x.ans).replace(/"/g,"&quot;"):""}"></div>`;
      d.querySelector("input").oninput=e=>{ x.ans=e.target.value; count(); };
    }
    box.appendChild(d);
  });
  $("#rendre").onclick=finishDevoir;
  count(); tick();
}
function count(){ const n=DV.items.filter(x=>x.ans!==null&&x.ans!=="").length; const e=$("#dvc"); if(e) e.textContent=n+" / 20 réponses"; }
let TIMER=null;
function tick(){
  clearInterval(TIMER);
  const f=()=>{ const t=$("#tm"); if(!t||!DV||!DV.running){ clearInterval(TIMER); return; } const r=Math.max(0,DV.end-Date.now()); const m=Math.floor(r/60000), s=Math.floor(r/1000)%60; t.textContent=m+":"+String(s).padStart(2,"0"); t.classList.toggle("low",r<5*60000); if(r<=0) finishDevoir(); };
  f(); TIMER=setInterval(f,1000);
}
function finishDevoir(){
  if(!DV||!DV.running) return; DV.running=false; clearInterval(TIMER);
  let n=0; DV.items.forEach(x=>{ x.ok = x.type==="q" ? x.ans===x.q.a : (x.ans? traceOk(x.t,x.ans):false); if(x.ok) n++; });
  const dt=new Date(); S.dv.push({n, d:dt.getDate()+"/"+(dt.getMonth()+1)}); save();
  const per=DATA.map((c,i)=>{ const its=DV.items.filter(x=>x.ci===i); return [i,its.filter(x=>x.ok).length,its.length]; }).filter(x=>x[2]);
  const weak=per.filter(p=>p[1]/p[2]<0.6).map(p=>`<a href="#${DATA[p[0]].id}" style="color:${COLORS[p[0]]};font-weight:800">${DATA[p[0]].short}</a>`);
  $("#main").innerHTML = `<span class="eyebrow">Devoir blanc · corrigé</span>
  <div class="card result" style="margin:10px 0 20px"><span class="note ${n>=10?"good":"bad"}">${n}<small style="font-size:24px">/20</small></span>
    <div><b style="font-size:18px">${n>=16?"Très bien.":n>=12?"Bien.":n>=10?"La moyenne est là.":"Il faut retravailler."}</b>
    <div class="muted" style="margin-top:4px">${per.map(p=>`${DATA[p[0]].short} ${p[1]}/${p[2]}`).join(" · ")}</div>
    ${weak.length?`<div style="margin-top:6px">À revoir en priorité : ${weak.join(", ")}</div>`:""}</div>
    <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="again">Un autre devoir</button><a class="btn ghost" href="#accueil">Accueil</a></div></div>
  <div id="corr"></div>`;
  const C=$("#corr");
  DV.items.forEach((x,k)=>{
    const d=document.createElement("div"); d.className="q"; d.style.setProperty("--c",COLORS[x.ci]);
    if (x.type==="q"){
      d.innerHTML=`<div class="qt"><span class="qn">${k+1}</span><span>${x.q.q}</span></div><div class="opts">${x.order.map(i=>`<button class="opt ${i===x.q.a?"right":(i===x.ans?"wrong":"")}" disabled>${esc(x.q.o[i])}</button>`).join("")}</div><div class="why">${x.ok?'<b class="v">Juste.</b> ':(x.ans===null?'<b class="x">Sans réponse.</b> ':'<b class="x">Faux.</b> ')}${x.q.why}</div>`;
    } else {
      d.innerHTML=`<div class="qt"><span class="qn">${k+1}</span><span>${x.t.title}</span></div>${face(x.t.lang,x.t.src,null,x.t.lang==="algo"?"ALGORITHME":"PYTHON")}<div class="why">${x.ok?'<b class="v">Juste.</b>':'<b class="x">'+(x.ans?"Ta réponse : "+esc(x.ans)+".":"Sans réponse.")+'</b>'} Réponse : <code>${esc(x.t.ans)}</code>. ${x.t.why}</div>`;
    }
    C.appendChild(d);
  });
  $("#again").onclick=startDevoir;
  rail("devoir"); window.scrollTo(0,0);
}

/* ---------------- séries et sujets */
function group(gi){
  const g = GROUPS[gi], n = 7 + gi;
  document.documentElement.style.setProperty("--c", COLORS[n-1]);
  S.rev = S.rev || {};
  const prev = gi===0 ? {id:DATA[5].id, s:DATA[5].short, c:COLORS[5]} : {id:GROUPS[gi-1].id, s:SHORTG[GROUPS[gi-1].id], c:COLORS[n-2]};
  const next = gi===3 ? {id:"devoir", s:"Devoir blanc", c:"var(--cx)"} : {id:GROUPS[gi+1].id, s:SHORTG[GROUPS[gi+1].id], c:COLORS[n]};
  $("#main").innerHTML = `${levelHead(n, g.title, TAGS[n-1])}
  <p class="goal">${g.goal} ${g.items.length} exercices. Écris ta réponse comme sur ta copie, puis rends-la : la correction s'ouvre seulement après.</p>
  <div class="block boxes"><div class="box"><div class="bt">Méthode</div>1. Lis l'énoncé et repère les contraintes (bornes, « non vide », messages exacts). 2. Écris l'algorithme ou le programme dans la case. 3. Rends ta copie, compare, puis note-toi honnêtement.</div>
  <div class="box cours"><div class="bt">Ton code</div>Quand tu m'as envoyé ton Python, la correction montre l'algorithme qui lui correspond, ton code, et ce qu'il faut corriger.</div></div>
  <div id="probs">${g.items.map(probCard).join("")}</div>
  <div style="display:flex;justify-content:space-between;margin-top:26px;gap:10px;flex-wrap:wrap">
    <a class="btn ghost small" href="#${prev.id}" style="--c:${prev.c}">← ${prev.s}</a>
    <a class="btn small" href="#${next.id}" style="--c:${next.c}">${next.s} →</a></div>`;
  g.items.forEach(wireProb);
}
function statusPill(id){ return S.exo[id]==="ok" ? '<span class="done-pill">J\'avais juste</span>' : S.exo[id]==="redo" ? '<span class="redo-pill">À revoir</span>' : ""; }
function probCard(e){
  return `<article class="prob" id="p-${e.id}">
    <div class="ph"><span class="tag">${e.label}</span><h3>${e.title}</h3><span class="st">${statusPill(e.id)}</span>${e.his.length?'<span class="tag" style="--c:var(--blue)">ton code</span>':""}</div>
    <div class="enonce">${e.enonce}</div>
    <div class="ans"><label for="ta-${e.id}">TA RÉPONSE · ALGORITHME OU PYTHON</label>
      <textarea id="ta-${e.id}" spellcheck="false" autocomplete="off" placeholder="Écris ici ton algorithme ou ton programme, comme sur ta copie.">${esc(S.ans[e.id]||"")}</textarea></div>
    <div class="lock"><button class="btn small" data-act="rendre">Rendre ma copie et voir la correction</button><button class="btn small ghost" data-act="bloque">Je bloque</button><span class="msg"></span></div>
    <div class="corr" hidden></div></article>`;
}
function corrHTML(e){
  const tabs = [["algo","Algorithme"],["py","Python corrigé"]];
  if (e.his.length) tabs.push(["his","Ton code"]);
  if (e.notes.length) tabs.push(["notes", e.his.length ? "À corriger dans ton code" : "Remarques"]);
  const td = e.td.length ? `<table class="tdo"><tr><th>Objet</th><th>Type / Nature</th></tr>${e.td.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table>` : "";
  const panes = {
    algo: face("algo", e.algo) + td,
    py: face("py", e.py),
    his: e.his.map(f=>face("py", EXDATA.his[f]||"", null, "TON FICHIER · "+esc(f))).join('<div style="height:10px"></div>'),
    notes: `<ul class="notes">${e.notes.map(x=>`<li>${x}</li>`).join("")}</ul>`
  };
  return `<div class="ctabs">${tabs.map((x,i)=>`<button data-tab="${x[0]}" class="${i===0?"on":""}">${x[1]}</button>`).join("")}</div>
    ${tabs.map((x,i)=>`<div class="cpane" data-pane="${x[0]}" ${i?"hidden":""}>${panes[x[0]]}</div>`).join("")}
    <div class="selfgrade">Compare avec ta réponse :<button class="btn small" data-g="ok" style="--c:var(--good)">J'avais juste</button><button class="btn small ghost" data-g="redo" style="--c:var(--warn)">À revoir</button></div>`;
}
function wireProb(e){
  const el = document.getElementById("p-"+e.id), ta = el.querySelector("textarea"), go = el.querySelector('[data-act="rendre"]'),
        bl = el.querySelector('[data-act="bloque"]'), msg = el.querySelector(".lock .msg"), corr = el.querySelector(".corr");
  const len = () => ta.value.replace(/\s/g,"").length;
  const upd = () => { go.disabled = len() < 20; msg.textContent = go.disabled && !corr.hidden ? "" : (go.disabled ? "Écris ta réponse pour débloquer la correction." : ""); };
  const reveal = () => {
    corr.innerHTML = corrHTML(e); corr.hidden = false; S.rev[e.id] = 1; save();
    go.textContent = "Correction ouverte"; go.disabled = true; bl.hidden = true; msg.textContent = "";
    corr.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ corr.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x===b)); corr.querySelectorAll("[data-pane]").forEach(p=>p.hidden = p.dataset.pane!==b.dataset.tab); });
    corr.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ S.exo[e.id]=b.dataset.g; save(); el.querySelector(".st").innerHTML=statusPill(e.id); rail(location.hash.slice(1)); });
  };
  ta.oninput = () => { S.ans[e.id] = ta.value; save(); if (corr.hidden) upd(); };
  ta.onkeydown = ev => { if (ev.key==="Tab" && !ev.shiftKey){ ev.preventDefault(); const s=ta.selectionStart; ta.setRangeText("    ", s, ta.selectionEnd, "end"); ta.oninput(); } };
  go.onclick = () => { if (len() >= 20) reveal(); };
  bl.onclick = () => { if (bl.dataset.sure) reveal(); else { bl.dataset.sure = 1; bl.textContent = "Voir quand même"; msg.textContent = "Essaie au moins l'entête et la boucle principale : c'est là que se prennent les points."; } };
  if (S.rev && S.rev[e.id]) reveal(); else upd();
}

/* ---------------- router */
function route(){
  const h = location.hash.slice(1) || "accueil";
  const idx = DATA.findIndex(c=>c.id===h);
  if (h!=="devoir" && DV && DV.running){ /* devoir keeps running in background */ }
  if (idx>=0){ if (route.last!==h) TAB="cours"; rail(h); chapter(DATA[idx], idx); }
  else if (GROUPS.some(g=>g.id===h)){ rail(h); group(GROUPS.findIndex(g=>g.id===h)); }
  else if (h==="devoir"){ rail(h); devoir(); }
  else if (h==="flashcards"){ rail(h); flashcards(); }
  else { rail("accueil"); home(); }
  route.last=h; window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
